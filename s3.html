<style>
/* --- Styles unchanged from your version --- */
body { font-family: Arial, sans-serif;font-size: 18px; background-color: #000; color: #fff; }
.row {overflow-wrap: break-word; display: flex; justify-content: center; gap: 5px; margin-top: 10px;font-size:17px; }
.block {overflow-wrap: break-word; text-align: center;flex: 1; max-width: 50%; }
.roster-box {overflow-wrap: break-word;
    text-align: left;
    width: 100%;       /* Fill the block it's inside */
    margin-top: 10px;
    padding: 8px 6px;
    min-height: 1px;
    font-size: 18px;
    white-space: pre-line;
    background-color: #000;
    color: #fff;
    box-sizing: border-box; /* IMPORTANT: Keeps padding inside the width */
}
label { font-weight:bold; color:#color: #fff;; font-size:20px; }
.playerName { cursor:pointer; padding:2px 0; }
.playerName:hover { background-color:#333; }
h3 { margin:0 0 8px 0; color:#fff; }
input[type="number"] { width:35px; padding:4px 6px; font-size:20px; background-color:#fff; color:#000; border:1px solid #fff; border-radius:4px; margin-bottom:4px; text-align:center; }
.stat-row { display:flex; flex-direction:column; align-items:center; margin-bottom:4px; }
.stat-row label { width:auto; text-align:center; margin-bottom:4px;color: #1e90ff; }
.center-label { display:flex; flex-direction:column; align-items:center; }
select, input, button { font-size:inherit; font-family:inherit; }
.form-wrapper {
    width: 100%; /* Spans full width */
    padding: 2px;
    border: 4px solid #1e90ff;
    border-radius: 0; /* Optional: remove radius for true edge-to-edge look */
    box-sizing: border-box; /* Crucial: includes padding/border in 100% width */
}
    /* --- Universal Master Modal --- */
#masterModal {
    display: none; 
    position: fixed; 
    inset: 0; 
    background: rgba(0, 0, 0, 0.9); 
    justify-content: center; 
    align-items: center; 
    z-index: 100000;
    padding: 10px;
}

.modal-container {
    background: #111; 
    padding: 20px; 
    border: 2px solid #1e90ff; 
    border-radius: 12px; 
    width: 100%; 
    max-width: 450px; 
    max-height: 85vh; /* Prevents modal from cutting off on small screens */
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    box-shadow: 0 0 20px rgba(30, 144, 255, 0.3);
}

#modalContent {
    overflow-y: auto; /* Makes Match History scrollable */
    margin-bottom: 20px;
    color: #fff;
    scrollbar-width: thin; /* Clean scrollbars for Firefox */
    scrollbar-color: #1e90ff #111;
}

#modalFooter {
    display: flex; 
    gap: 10px; 
    justify-content: center;
    flex-wrap: wrap; /* Wraps buttons if they are too wide on small phones */
}

/* Standardizing Modal Buttons */
#modalFooter button {
    padding: 10px 18px; 
    border: none; 
    border-radius: 6px; 
    font-weight: bold; 
    font-size: 16px;
    cursor: pointer;
    transition: opacity 0.2s;
}

#modalFooter button:active {
    opacity: 0.7;
}

.playerName {
  display: flex;           /* allow name and HC to be on same line */
  justify-content: space-between; /* push HC to right */
  padding: 2px 0;
  cursor: pointer;
}

.playerName span.hc {
  color: #fff;             /* lighter color for HC */
  -weight: normal;
}
  #lagWinnerHeader,
#lagLoserHeader {
    font-size: 18px;
    margin-bottom: 10px;color: #1e90ff;
}
    .button-row {
    display: flex;         /* Align buttons in a row */
    justify-content: space-between; /* Evenly space them */
    gap: 5px;              /* Tiny gap between buttons */
    width: 100%;           /* Fill the container */
    margin-top: 20px;
    box-sizing: border-box;
}

.button-row button {
    flex: 1;               /* Forces all 4 buttons to be exactly the same width */
    height: 40px;
    font-size: 18px;       /* Slightly smaller to ensure "Transfer" fits on small phones */
    padding: 0;            /* Remove internal padding to save space */
    text-align: center;
    white-space: nowrap;   /* Prevents text from wrapping to a second line */
}
/* MOBILE STYLES */
@media (max-width:600px) {

.form-wrapper { margin:1px;}
.roster-box { overflow-wrap: break-word;
    text-align: left; 
    width: 90%;       /* take up most of the screen on mobile */
    max-width: 300px; /* optional: don’t let it get too wide on large phones */
    margin: 0 auto;   /* center it horizontally */
  }
}
.button-row button {font-size: 14px;}
.lag-row {gap:10px; width:100%; margin-top:20px; align-items:center; text-align:center;display: none;}
.stat-row { display:flex; flex-direction:column; align-items:center; margin-bottom:4px; }
.stat-row label { width:auto; text-align:center; margin-bottom:4px; }
.player-stats-container { position:relative; display:flex; justify-content:center; gap:60px; }
.player-stats-container::after { content:""; position:absolute; top:0; bottom:0; left:50%; transform:translateX(-50%); width:2px; background-color:#fff; opacity:0.7; pointer-events:none; }
.back-button { display: block; margin: 15px auto 0 auto; background-color: #1e90ff; color: #fff; border-radius: 6px; text-decoration: none; font-size: 24px; text-align: center; }
 /* Floating timer box */
#timerBox {
  display: none;
  width:125px;
  top: 50%;
  right: calc(50% - 10px); /* ← nudge RIGHT */
  background: #000;
  color: #fff;
  border-radius: 8px;

  box-shadow: 0 4px 10px rgba(0,0,0,0.3);

}
  #timerValue {

  }
  .closeBtn {
    background: crimson;
    border: none;
    color: white;
    margin-left: 10px;
    border-radius: 4px;
    cursor: pointer;
  }
  .startBtn {
    font-size: 1em;
    cursor: pointer;
  }
    /* Spinner Overlay */
#loadingOverlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.8);
    z-index: 10000;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
}

.spinner {
    width: 50px;
    height: 50px;
    border: 5px solid #333;
    border-top: 5px solid #1e90ff; /* Theme blue */
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 15px;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

    <script>
let isLoading = false;
const FORM_KEY = "scoresheetData";
let scores = JSON.parse(localStorage.getItem("teamMatchScores")) || { home: 0, away: 0 };
let flip = false;

// 1. Populate roster when team selects
function updateRoster(sel, div) {
    if (!sel.value) {
        div.innerHTML = "";
        return;
    }
    
    const rosterData = scoresheetinfo[sel.value] || [];
    
    div.innerHTML = rosterData.map(p => {
        // If name isn't in your scoresheetrosters.js file, it's a 3
        const lookupHC = scoresheetrosters[p];
        const hc = (lookupHC !== undefined && lookupHC !== 0) ? lookupHC : 3;

        return `<div class="playerName" data-p="${p}" data-hc="${hc}">
                    <span class="name">${p}</span>
                    <span class="hc">${hc}</span>
                </div>`;
    }).join("");
}
// 2. Event Listeners for Team Selection
["team", "opponent"].forEach(id => {
    document.getElementById(id).addEventListener("change", function() {
        const divId = (id === "team") ? "teamRoster" : "opponentRoster";
        updateRoster(this, document.getElementById(divId));
        saveNow();
    });
});

// 3. Player Selection Logic (Master Modal Version)
document.addEventListener("click", e => {
    const playerDiv = e.target.closest(".playerName");
    if (!playerDiv) return;

    const name = playerDiv.getAttribute("data-p");
    const hc = playerDiv.getAttribute("data-hc");
    const lwHeader = document.getElementById("lagWinnerHeader").textContent;

    pendingPlayerData = { name, hc };

    if (lwHeader === "Lag Winner") {
        showMasterModal("Confirm Lag Winner", `<p>Did <strong>${name}</strong> win the lag?</p>`, [
            { text: "YES", action: "confirmLag(true)", color: "#1e90ff" }
        ]);
    } else {
        if (name === document.getElementById("lagWinner").value) return;
        showMasterModal("Confirm Lag Loser", `<p>Set <strong>${name}</strong> as Lag Loser and begin match?</p>`, [
            { text: "YES", action: "confirmLag(false)", color: "#1e90ff" }
        ]);
    }
});

function confirmLag(isWinner) {
    if (isWinner) {
        document.getElementById("lagWinner").value = pendingPlayerData.name;
        document.getElementById("pA_hc").value = pendingPlayerData.hc;
        document.getElementById("lagWinnerHeader").textContent = pendingPlayerData.name;
    } else {
        document.getElementById("lagLoser").value = pendingPlayerData.name;
        document.getElementById("pB_hc").value = pendingPlayerData.hc;
        document.getElementById("lagLoserHeader").textContent = pendingPlayerData.name;
        document.getElementById("matchInnings").value = 0;
        checkRosterCollapse();
    }
    closeMasterModal();
    saveNow();
}
    function resetLagFields() {
    document.getElementById("lagWinner").value = "";
    document.getElementById("lagLoser").value = "";
    document.getElementById("pA_hc").value = 0;
    document.getElementById("pB_hc").value = 0;
    document.getElementById("lagWinnerHeader").textContent = "Lag Winner";
    document.getElementById("lagLoserHeader").textContent = "Lag Loser";
    document.getElementById("matchInnings").value = 0;
    checkRosterCollapse();
    closeLagModal();
    saveNow();
}

// Close if clicking outside the box
window.onclick = (e) => { if (e.target.id === "masterModal") closeModal(); };
function closeLagModal() {
    document.getElementById("lagConfirmModal").style.display = "none";
    pendingPlayerData = null;
}

// 4. Scoring UI Update
function updateScoreUI() {
    const hScore = document.getElementById("homeScore");
    const aScore = document.getElementById("awayScore");
    if (hScore && aScore) {
        hScore.textContent = scores.home;
        aScore.textContent = scores.away;
    }
}

function changeStat(id, amount) {
    const el = document.getElementById(id);
    if (!el) return;

    el.value = Math.max(0, (parseInt(el.value) || 0) + amount);

    // Trigger the roster hide/show logic if Innings changed
    if (id === 'matchInnings') {
        checkRosterCollapse();
    }

    if (id === 'pA_wins' || id === 'pB_wins') {
        document.getElementById('pA_coach').checked = false;
        document.getElementById('pB_coach').checked = false;
        updateMatchWinner();
    }

    if (id === 'pA_hc' || id === 'pB_hc') {
        updateMatchWinner();
    }

    saveNow();
}

// Keep this for any existing Innings calls, or update buttons to changeStat('matchInnings', amount)
function changeInnings(amount) {
    changeStat('matchInnings', amount);
}
// 6. Match Winner Logic
function updateMatchWinner() {
    const aWins = parseInt(document.getElementById("pA_wins").value) || 0;
    const bWins = parseInt(document.getElementById("pB_wins").value) || 0;
    const aHC = parseInt(document.getElementById("pA_hc").value) || 0;
    const bHC = parseInt(document.getElementById("pB_hc").value) || 0;
    const winField = document.getElementById("matchWinner");
    const subBtn = document.getElementById("submitMatch");

    if (aWins === aHC && aHC > 0) {
        winField.value = document.getElementById("lagWinner").value;
    } else if (bWins === bHC && bHC > 0) {
        winField.value = document.getElementById("lagLoser").value;
    } else {
        winField.value = "";
    }
    subBtn.style.display = winField.value ? "inline-block" : "none";
}

// 7. Submit to Google Sheets
document.getElementById("submitMatch").onclick = function() {
    const btn = this;
    const loader = document.getElementById("loadingOverlay");

    // Start Loading State
    btn.disabled = true;
    loader.style.display = "flex"; // Show the spinner overlay

    const data = {
        team: document.getElementById("team").value,
        opponent: document.getElementById("opponent").value,
        lagWinner: document.getElementById("lagWinner").value,
        lagLoser: document.getElementById("lagLoser").value,
        matchInnings: document.getElementById("matchInnings").value,
        pA: {
            handicap: document.getElementById("pA_hc").value,
            wins: document.getElementById("pA_wins").value,
            safeties: document.getElementById("pA_safeties").value,
            b8: document.getElementById("pA_b8").value,
            br: document.getElementById("pA_br").value,
            e8: document.getElementById("pA_e8").value
        },
        pB: {
            handicap: document.getElementById("pB_hc").value,
            wins: document.getElementById("pB_wins").value,
            safeties: document.getElementById("pB_safeties").value,
            b8: document.getElementById("pB_b8").value,
            br: document.getElementById("pB_br").value,
            e8: document.getElementById("pB_e8").value
        },
        matchWinner: document.getElementById("matchWinner").value,
        matchNotes: document.getElementById("matchNotes").value
    };

    fetch("https://script.google.com/macros/s/AKfycbxjPd21vbwaqtxnDHyiwq-232S6vxdG-t6JPd2nQrdi9bbH8EakOr4S_11jDF9uvu4/exec", {
        method: "POST",
        mode: "no-cors", 
        body: JSON.stringify(data)
    })
    .then(() => {
        // --- End Loading State ---
        loader.style.display = "none"; 

        // --- SAVE TO HISTORY ---
        const history = JSON.parse(localStorage.getItem("matchHistory")) || [];
        history.push(data); 
        localStorage.setItem("matchHistory", JSON.stringify(history));
        
        localStorage.setItem("lastSessionActivity", Date.now().toString());

        // --- Update Team Scores ---
        const winnerName = document.getElementById("matchWinner").value;
        const homeTeamName = document.getElementById("team").value;
        const homeRoster = scoresheetinfo[homeTeamName] || [];

        if (homeRoster.includes(winnerName)) {
            scores.home++;
        } else {
            scores.away++;
        }
        localStorage.setItem("teamMatchScores", JSON.stringify(scores));
        updateScoreUI();

        // --- RESET PLAYER FIELDS ---
        const fieldsToReset = [
            "lagWinner", "lagLoser", "matchInnings", "matchWinner",
            "pA_hc", "pA_wins", "pA_safeties", "pA_b8", "pA_br", "pA_e8",
            "pB_hc", "pB_wins", "pB_safeties", "pB_b8", "pB_br", "pB_e8"
        ];

        fieldsToReset.forEach(id => {
            const el = document.getElementById(id);
            if (el) el.value = el.type === "number" ? 0 : "";
        });
checkRosterCollapse();
        document.getElementById("lagWinnerHeader").textContent = "Lag Winner";
        document.getElementById("lagLoserHeader").textContent = "Lag Loser";
        document.getElementById("matchNotes").value = "-";
        document.getElementById('pA_coach').checked = false;
        document.getElementById('pB_coach').checked = false;
        // --- HANDLE 5TH MATCH SCENARIO ---
        if ((scores.home + scores.away) >= 5) {
            alert(`Match 5 complete! Final Score: ${scores.home} - ${scores.away}. Resetting session fields, but history is saved.`);
            document.getElementById("team").selectedIndex = 0;
            document.getElementById("opponent").selectedIndex = 0;
            updateRoster(document.getElementById("team"), document.getElementById("teamRoster"));
            updateRoster(document.getElementById("opponent"), document.getElementById("opponentRoster"));
            scores = { home: 0, away: 0 };
            localStorage.setItem("teamMatchScores", JSON.stringify(scores));
            updateScoreUI();
        }

        btn.style.display = "none";
        btn.disabled = false;
        btn.style.opacity = "1";

        saveNow();
        alert("Match submitted!"); // Final confirmation alert
    })
    .catch(err => {
        loader.style.display = "none";
        alert("Error submitting match.");
        btn.disabled = false;
    });
};
    // 8. Save/Load Logic
function saveNow() {
    if (isLoading) return;
    const data = {};

    // Automatically grab every input, select, and textarea that has an ID
    document.querySelectorAll("input[id], select[id], textarea[id]").forEach(el => {
        data[el.id] = el.type === "checkbox" ? el.checked : el.value;
    });

    // Save the text headers (the player names)
    data.lwH = document.getElementById("lagWinnerHeader").textContent;
    data.llH = document.getElementById("lagLoserHeader").textContent;

    // Save the overall team match scores
    data.mScores = JSON.parse(localStorage.getItem("teamMatchScores")) || { home: 0, away: 0 };

    localStorage.setItem(FORM_KEY, JSON.stringify(data));
}
function loadScoresheet() {
    // 1. Restore manual roster additions
    const savedManual = localStorage.getItem("manual_roster_additions");
    if (savedManual) Object.assign(scoresheetinfo, JSON.parse(savedManual));

    const raw = localStorage.getItem(FORM_KEY);
    if (!raw) return;
    
    isLoading = true;
    const data = JSON.parse(raw);
    
    // 2. Automatically fill all fields found in the saved data
    Object.keys(data).forEach(id => {
        const el = document.getElementById(id);
        if (el) {
            if (el.type === "checkbox") {
                el.checked = data[id] === true;
            } else {
                el.value = data[id];
            }
        }
    });

    // 3. Restore the text headers (Names)
    if (data.lwH) document.getElementById("lagWinnerHeader").textContent = data.lwH;
    if (data.llH) document.getElementById("lagLoserHeader").textContent = data.llH;

    // 4. Restore team match scores
    if (data.mScores) {
        scores = data.mScores;
        localStorage.setItem("teamMatchScores", JSON.stringify(scores));
        updateScoreUI();
    }

    // 5. Refresh the UI state
    updateRoster(document.getElementById("team"), document.getElementById("teamRoster"));
    updateRoster(document.getElementById("opponent"), document.getElementById("opponentRoster"));
    checkRosterCollapse();
    updateMatchWinner();
    
    isLoading = false;
}
// 9. Extra UI Helpers
function exportScoresheet() {
    const data = localStorage.getItem(FORM_KEY);
    if (!data) return alert("No data to transfer.");
    const baseUrl = window.location.href.split('?')[0];
    const fullUrl = `${baseUrl}?data=${encodeURIComponent(data)}`;
    
    const bodyHtml = `
        <p style="margin-bottom:15px; font-size:14px; color:#ccc;">Scan to transfer the current scoresheet.</p>
        <div id="qrcode" style="display:flex; justify-content:center; padding:10px; background:#fff; border-radius:8px; width:fit-content; margin: 0 auto;"></div>
    `;

    showMasterModal("Transfer Scoresheet", bodyHtml);

    setTimeout(() => {
        new QRCode(document.getElementById('qrcode'), { text: fullUrl, width: 200, height: 200 });
    }, 50);
}
function toggleNotes() { const box = document.getElementById("notesContainer"); box.style.display = box.style.display === "none" ? "block" : "none"; }

let timerInterval, seconds = 0;
function startTimer() {
    seconds = 0;
    document.getElementById("timerBox").style.display = "block";
    clearInterval(timerInterval);
    timerInterval = setInterval(() => { seconds++; updateTimerDisplay(); }, 1000);
}
function closeTimer() { clearInterval(timerInterval); document.getElementById("timerBox").style.display = "none"; }
function updateTimerDisplay() {
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    document.getElementById("timerValue").textContent = `${mins}:${secs < 10 ? '0' + secs : secs}`;
}
// 10. Initialization
window.addEventListener("DOMContentLoaded", () => {
    // Check for 12-hour expiration since last activity
    const lastActivity = localStorage.getItem("lastSessionActivity");
    const twelveHours = 12 * 60 * 60 * 1000;

    if (lastActivity && (Date.now() - parseInt(lastActivity)) > twelveHours) {
        console.log("Session expired. Clearing history and manual players.");
        localStorage.removeItem("matchHistory");
        localStorage.removeItem("manual_roster_additions");
        localStorage.removeItem("teamMatchScores");
        localStorage.removeItem(FORM_KEY);
        localStorage.removeItem("lastSessionActivity");
        scores = { home: 0, away: 0 };
    } else {
        // If within 12 hours, update activity timestamp to "now"
        localStorage.setItem("lastSessionActivity", Date.now().toString());
    }

    const params = new URLSearchParams(window.location.search);
    
    // --- HANDLE MAIN FORM TRANSFER ---
    if (params.has("data")) {
        localStorage.setItem(FORM_KEY, decodeURIComponent(params.get("data")));
        // Clean URL immediately
        window.history.replaceState({}, document.title, window.location.pathname);
    }
    
    // --- HANDLE HISTORY ONLY TRANSFER ---
    if (params.has("hdata")) {
        const hRaw = decodeURIComponent(params.get("hdata"));
        localStorage.setItem("matchHistory", hRaw);
        
        // Clean URL immediately
        window.history.replaceState({}, document.title, window.location.pathname);
        
        alert("Match History Sync Successful!");
        // Refresh history modal if it's currently open
        if (typeof showHistory === "function") showHistory(); 
    }
    
    // Final UI Refresh
    loadScoresheet();
    updateScoreUI();
});
        // Function to show the history modal
function showHistory() {
    const history = JSON.parse(localStorage.getItem("matchHistory")) || [];
    
    // 1. Build the Table HTML
    let tableHtml = `
        <table style="width:100%; border-collapse: collapse; color: white; font-size: 14px;">
            <thead>
                <tr style="border-bottom: 2px solid #444;">
                    <th style="padding:8px; text-align:left;">Match</th>
                    <th style="padding:8px; text-align:center;">Result</th>
                    <th style="padding:8px; text-align:center;">Inn.</th>
                </tr>
            </thead>
            <tbody>`;

    if (history.length === 0) {
        tableHtml += '<tr><td colspan="3" style="text-align:center; padding:20px;">No matches yet.</td></tr>';
    } else {
        tableHtml += history.map((m, index) => `
            <tr style="border-bottom: 1px solid #333;">
                <td style="padding:8px; text-align:left;">
                    <div style="font-weight:bold; color:#1e90ff;">M${index + 1}</div>
                    <small>${m.lagWinner} vs ${m.lagLoser}</small>
                </td>
                <td style="padding:8px; text-align:center;">
                    ${m.pA.wins}-${m.pB.wins}<br>
                    <small style="color:#0f0;">${m.matchWinner}</small>
                </td>
                <td style="padding:8px; text-align:center;">${m.matchInnings}</td>
            </tr>`).join("");
    }
    tableHtml += `</tbody></table>`;

    // 2. Define the buttons
    const historyButtons = [
        { text: "Transfer", action: "exportHistoryOnly()", color: "#1e90ff" },
        { text: "Reset", action: "clearHistory()", color: "crimson" }
    ];

    // 3. Open the Universal Modal
    showMasterModal("Match History", tableHtml, historyButtons);
}
function clearHistory() {
    // 1. Build the "Are you sure?" content
    const warningHtml = `
        <div style="text-align:center; padding: 10px 0;">
            <p style="color:#ff4444; font-size:18px; font-weight:bold; margin-bottom:10px;">⚠️ Clear All History?</p>
            <p style="color:#ccc; font-size:14px;">This will permanently delete all match results from this session.</p>
        </div>
    `;

    // 2. Custom buttons for the "Are you sure" screen
    const buttons = [
        { text: "YES, DELETE", action: "executeClearHistory()", color: "crimson" },
        { text: "CANCEL", action: "showHistory()", color: "#444" }
    ];

    // 3. This overwrites the current History modal with the Warning screen
    showMasterModal("Confirm Reset", warningHtml, buttons);
}

function executeClearHistory() {
    // No 'if(confirm)' here! Just do the action:
    localStorage.removeItem("matchHistory");
    
    // Refresh the modal to show "No matches yet"
    showHistory(); 
}
function addNewPlayerManual() {
    const homeName = document.getElementById("team").value || "Home Team";
    const awayName = document.getElementById("opponent").value || "Away Team";

    // The content inside the modal
    const bodyHtml = `
        <input type="text" id="manualPlayerName" placeholder="Enter Player Name" 
               style="width:100%; padding:12px; font-size:18px; margin-bottom:20px; border-radius:6px; border:1px solid #444; background:#111; color:white; box-sizing: border-box;">
        
        <div style="margin-bottom: 5px; color:white; font-size:18px; display: flex; flex-direction: column; gap: 15px; align-items: flex-start; padding-left: 10px;">
            <label style="cursor:pointer; color:#fff; text-transform:none;">
                <input type="radio" name="npTeam" value="home" checked style="transform: scale(1.3); margin-right:10px;"> ${homeName}
            </label>
            <label style="cursor:pointer; color:#fff; text-transform:none;">
                <input type="radio" name="npTeam" value="away" style="transform: scale(1.3); margin-right:10px;"> ${awayName}
            </label>
        </div>
    `;

    // The buttons at the bottom
    const buttons = [
        { text: "Add to Roster", action: "confirmNewPlayer()", color: "#1e90ff" }
    ];

    showMasterModal("Add to Roster", bodyHtml, buttons);
    
    // Tiny delay to ensure the element exists before focusing
    setTimeout(() => document.getElementById("manualPlayerName").focus(), 100);
}
function confirmNewPlayer() {
    const nameInput = document.getElementById("manualPlayerName");
    const newName = nameInput.value.trim();
    if (!newName) return;
    
    const side = document.querySelector('input[name="npTeam"]:checked').value;
    const teamDropdown = document.getElementById(side === 'home' ? "team" : "opponent");
    const teamName = teamDropdown.value;

    if (!scoresheetinfo[teamName]) scoresheetinfo[teamName] = [];
    
    if (!scoresheetinfo[teamName].some(p => p.toLowerCase() === newName.toLowerCase())) {
        scoresheetinfo[teamName].push(newName);
        localStorage.setItem("manual_roster_additions", JSON.stringify(scoresheetinfo));
        updateRoster(teamDropdown, document.getElementById(side === 'home' ? "teamRoster" : "opponentRoster"));
        saveNow();
    }
    
    closeMasterModal(); // Closes the universal modal
}
        function exportHistoryOnly() {
    const history = localStorage.getItem("matchHistory");
    if (!history || history === "[]") return alert("No history to transfer.");
    
    const baseUrl = window.location.href.split('?')[0];
    const fullUrl = `${baseUrl}?hdata=${encodeURIComponent(history)}`;
    
    // 1. Define the content: A title and a placeholder div for the QR code
    const bodyHtml = `
        <p style="margin-bottom:15px; font-size:14px; color:#ccc;">Scan to sync match history to another device.</p>
        <div id="qrcode" style="display:flex; justify-content:center; padding:10px; background:#fff; border-radius:8px; width:fit-content; margin: 0 auto;"></div>
    `;

    // 2. Open the Universal Modal
    showMasterModal("Transfer History", bodyHtml);

    // 3. Generate the QR Code (Wait 50ms to ensure the div is rendered)
    setTimeout(() => {
        new QRCode(document.getElementById('qrcode'), { 
            text: fullUrl, 
            width: 200, 
            height: 200,
            correctLevel: QRCode.CorrectLevel.M
        });
    }, 50);
}
        function checkRosterCollapse() {
    const innings = parseInt(document.getElementById("matchInnings").value) || 0;
    const homeRoster = document.getElementById("teamRoster");
    const awayRoster = document.getElementById("opponentRoster");

    if (innings > 0) {
        // Hide rosters once the match starts
        if (homeRoster) homeRoster.style.display = "none";
        if (awayRoster) awayRoster.style.display = "none";
    } else {
        // Show rosters when innings are 0 (match not started or reset)
        if (homeRoster) homeRoster.style.display = "block";
        if (awayRoster) awayRoster.style.display = "block";
    }
}
    function updateCurrentWeekAndDate() {
    const today = new Date();

    // Today minus 2 days
    const cutoff = new Date(today);
    cutoff.setDate(cutoff.getDate() - 2);

    let activeWeek = null;

    for (const row of scheduleData) {
        if (!row.date) continue;

        const matchDate = new Date(row.date);

        // ✔ Correct rule:
        // Show this week until 2 days AFTER its match date
        if (matchDate >= cutoff) {
            activeWeek = row;
            break;
        }
    }

    // If we passed all weeks, use the last one
    if (!activeWeek) {
        activeWeek = scheduleData[scheduleData.length - 1];
    }

    document.getElementById("weekDisplay").textContent = "Week " + activeWeek.week;
    document.getElementById("dateDisplay").textContent = " " + activeWeek.date;
}
        window.addEventListener("load", updateCurrentWeekAndDate);
