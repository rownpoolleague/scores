<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Top 20</title>
    <style>
        body { font-family: sans-serif; display: flex; gap: 20px; justify-content: center; }
        table { border-collapse: collapse; width: 45%; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f4f4f4; }
        h2 { text-align: center; }
    </style>
</head>
<body>

    <div id="mvp-container">
        <h2>Top 20 MVP</h2>
        <table id="mvp-table">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Player Name</th>
                    <th>Score</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div id="improved-container">
        <h2>Top 20 Most Improved</h2>
        <table id="improved-table">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Player Name</th>
                    <th>Improvement</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script src="leaders.js"></script>
    <script>
        function populateTable(tableId, data) {
            const tbody = document.querySelector(`#${tableId} tbody`);
            // Only take the top 20
            data.slice(0, 20).forEach((player, index) => {
                const row = `<tr>
                    <td>${index + 1}</td>
                    <td>${player["Player Name"]}</td>
                    <td>${player.Score || player.Improvement}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        // Initialize tables on load
        window.onload = () => {
            if (typeof mvpList !== 'undefined') populateTable('mvp-table', mvpList);
            if (typeof mostImprovedList !== 'undefined') populateTable('improved-table', mostImprovedList);
        };
    </script>
</body>
</html>
