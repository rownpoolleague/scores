<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROPL Player Dashboard</title>
    <script src="playerdata.js"></script>
    <style>
        :root {
            --brand-blue: #1e90ff;
            --dark-bg: #000000;
            --card-bg: #111111;
            --text-main: #ffffff;
            --text-dim: #aaaaaa;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            border: 2px solid var(--brand-blue);
            min-height: 100vh;
            box-sizing: border-box;
            padding-bottom: 50px;
        }

        header {
            text-align: center;
            padding: 20px 10px;
        }

        h1 {
            color: var(--brand-blue);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            font-size: 1.8rem;
        }

        .search-container {
            padding: 20px;
            position: relative;
        }

        #playerInput {
            width: 100%;
            padding: 15px;
            background: #222;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            font-size: 1.1rem;
            box-sizing: border-box;
            outline: none;
        }

        .autocomplete-items {
            position: absolute;
            z-index: 99;
            top: 75px;
            left: 20px;
            right: 20px;
            background: #fff;
            color: #000;
            border-radius: 0 0 8px 8px;
            max-height: 250px;
            overflow-y: auto;
        }

        .autocomplete-items div {
            padding: 12px;
            cursor: pointer;
            border-bottom: 1px solid #ddd;
            font-weight: bold;
        }

        #statsBox {
            padding: 10px;
            display: none;
        }

        .profile-header {
            background: linear-gradient(180deg, #1a1a1a 0%, #000 100%);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid #333;
            margin-bottom: 15px;
        }

        #playerPhoto {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid var(--brand-blue);
            object-fit: cover;
            margin-bottom: 10px;
            box-shadow: 0 0 20px rgba(30, 144, 255, 0.4);
        }

        #playerName {
            font-size: 1.6rem;
            margin: 5px 0;
            text-transform: uppercase;
        }

        /* Restored Handicap Tag Style */
        .handicap-tag {
            background: var(--brand-blue);
            color: #000;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
        }

        .badge-shelf {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
        }

        .badge-mini {
            font-size: 1.8rem;
            cursor: pointer;
            transition: transform 0.1s;
            user-select: none;
        }
        .badge-mini:active { transform: scale(1.2); }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid #222;
            padding: 10px 5px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
            min-height: 65px;
            display:
 0;
    const m = parseInt(player["Mini-Slam"]) || 0;

    let earned = [];
    if (g >= 1000) earned.push("🐐"); else if (g >= 500) earned.push("👑"); else if (g >= 100) earned.push("💯");
    if (w >= 100) earned.push("🏆"); else if (w >= 50) earned.push("🥇"); else if (w >= 5) earned.push("🤝");
    if (s >= 20) earned.push("🚫"); else if (s >= 10) earned.push("🔥"); else if (s >= 5) earned.push("✨");
    if (b >= 20) earned.push("👹"); else if (b >= 1) earned.push("📸");
    if (o >= 20) earned.push("🧙‍♂️"); else if (o >= 1) earned.push("🧲");
    if (m >= 1) earned.push("⭐");

    if (earned.length === 0) {
        shelf.innerHTML = '<span style="color:#444; font-size:0.8rem;">No Badges Earned Yet</span>';
        return;
    }

    earned.forEach(icon => {
        const span = document.createElement('span');
        span.className = 'badge-mini';
        span.textContent = icon;
        span.title = badgeInfo[icon] || ""; // Tooltip for desktop
        
        // Mobile tap logic
        span.onclick = (e) => {
            const toast = document.getElementById('badgeToast');
            toast.textContent = badgeInfo[icon];
            toast.style.display = 'block';
            
            // Auto-hide after 2 seconds
            clearTimeout(window.badgeTimeout);
            window.badgeTimeout = setTimeout(() => {
                toast.style.display = 'none';
            }, 2000);
        };

        shelf.appendChild(span);
    });
}

    function renderStatCards(player) {
        const container = document.getElementById('statCards');
        container.innerHTML = '';

        for (const key in player) {
            if (["Player Name", "Handicap"].includes(key)) continue;

            const card = document.createElement('div');
            card.className = 'stat-card';
            card.onclick = () => showTop10(key);
            card.innerHTML = `
                <span class="stat-label">${key}</span>
                <span class="stat-value">${player[key]}</span>
            `;
            container.appendChild(card);
        }
    }

    function showTop10(statKey) {
        const lowerIsBetter = ["Life Hash", "White Washed"];
        const minMPStats = ["Match Win %", "Game Win %", "Life Hash", "% Weeks w/8OB, BR or Rackless", "White Washed"];

        const ranked = playerData
            .filter(p => minMPStats.includes(statKey) ? p["Matches Played"] >= 25 : true)
            .map(p => ({
                name: p["Player Name"],
                value: parseFloat(typeof p[statKey] === "string" ? p[statKey].replace('%', '') : p[statKey])
            }))
            .filter(p => !isNaN(p.value))
            .sort((a, b) => lowerIsBetter.includes(statKey) ? a.value - b.value : b.value - a.value)
            .slice(0, 10);

        const modalBody = document.getElementById('modalBody');
        document.getElementById('modalTitle').textContent = statKey;

        let tableHtml = `<table><tr><th>#</th><th>Player</th><th>Value</th></tr>`;
        ranked.forEach((p, i) => {
            tableHtml += `<tr><td class="rank-col">${i+1}</td><td>${p.name}</td><td>${p.value}</td></tr>`;
        });
        tableHtml += `</table>`;
        
        modalBody.innerHTML = tableHtml;
        document.getElementById('statModal').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('statModal').style.display = 'none';
    }
</script>
<div id="badgeToast" style="display:none; position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:rgba(30,144,255,0.9); color:#000; padding:10px 20px; border-radius:20px; font-weight:bold; z-index:2000; white-space:nowrap; pointer-events:none; box-shadow:0 4px 15px rgba(0,0,0,0.5);"></div>
</body>
</html>
