<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROPL Player Profiles</title>
    <script src="playerdata.js"></script>
    <style>
        :root {
            --brand-blue: #1e90ff;
            --dark-bg: #000000;
            --card-bg: #111111;
            --text-main: #ffffff;
            --text-dim: #aaaaaa;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            overflow-x: hidden; /* Prevents side-scrolling */
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            border-left: 2px solid var(--brand-blue);
            border-right: 2px solid var(--brand-blue);
            min-height: 100vh;
            box-sizing: border-box;
            padding-bottom: 50px;
            background: var(--dark-bg);
        }

        header {
            text-align: center;
            padding: 20px 10px;
        }

        h1 {
            color: var(--brand-blue);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            font-size: 1.8rem;
        }

        .search-container {
            padding: 20px;
            position: relative;
        }

        #playerInput {
            width: 100%;
            padding: 15px;
            background: #222;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            font-size: 1.1rem;
            box-sizing: border-box;
            outline: none;
        }

        .autocomplete-items {
            position: absolute;
            z-index: 99;
            top: 75px;
            left: 20px;
            right: 20px;
            background: #fff;
            color: #000;
            border-radius: 0 0 8px 8px;
            max-height: 250px;
            overflow-y: auto;
        }

        .autocomplete-items div {
            padding: 12px;
            cursor: pointer;
            border-bottom: 1px solid #ddd;
            font-weight: bold;
        }

        #statsBox {
            padding: 10px;
            display: none;
            box-sizing: border-box;
        }

        .profile-header {
            background: linear-gradient(180deg, #1a1a1a 0%, #000 100%);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid #333;
            margin-bottom: 15px;
        }

        .photo-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 10px;
        }

        #playerPhoto {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid var(--brand-blue);
            object-fit: cover;
            box-shadow: 0 0 20px rgba(30, 144, 255, 0.4);
        }

        #playerRank {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: var(--brand-blue);
            color: black;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.9rem;
            border: 2px solid #000;
        }

        #playerName {
            font-size: 1.6rem;
            margin: 5px 0;
            text-transform: uppercase;
        }

        .handicap-tag {
            background: var(--brand-blue);
            color: #000;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
        }

       .badge-shelf {
            display: flex;
            flex-direction: column; /* Stack icons above the text */
            align-items: center;
            gap: 10px;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            margin-top: 10px;
        }

        /* Container for icons to keep them side-by-side */
        .badge-icons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .badge-count-text {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--brand-blue);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-top: 1px solid #333;
            padding-top: 8px;
            width: 80%;
        }

        .badge-mini {
            font-size: 1.8rem;
            cursor: pointer;
            transition: transform 0.1s;
            user-select: none;
        }

        .badge-mini:active {
            transform: scale(1.2);
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid #222;
            padding: 10px 5px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 60px;
            box-sizing: border-box;
            overflow: hidden; /* Ensures text stays inside */
        }

        .stat-card:active {
            transform: scale(0.95);
            background: #1a1a1a;
        }

        .stat-label {
            color: var(--text-dim);
            font-size: 0.55rem; /* Shrunk slightly for better fit */
            text-transform: uppercase;
            display: block;
            margin-bottom: 5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--brand-blue);
        }

        #statModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            max-width: 400px;
            margin: 40px auto;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th { text-align: left; color: var(--text-dim); padding: 10px; border-bottom: 1px solid #333; font-size: 0.8rem; }
        td { padding: 12px 10px; border-bottom: 1px solid #222; font-size: 1.1rem; }
        .rank-col { color: var(--brand-blue); font-weight: bold; width: 40px; }

        .close-btn {
            background: var(--brand-blue);
            color: #000;
            border: none;
            padding: 12px 30px;
            font-weight: bold;
            border-radius: 5px;
            margin-top: 30px;
            text-transform: uppercase;
        }

        footer { text-align: center; margin-top: 40px; padding-bottom: 20px; }
        .footer-logo { max-width: 150px; opacity: 0.7; }
        .nav-btn {
            display: block;
            margin: 20px 0;
            padding: 15px;
            border: 1px solid var(--brand-blue);
            color: var(--brand-blue);
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            text-transform: uppercase;
            text-align: center;
        }

        #badgeToast {
            display:none; 
            position:fixed; 
            bottom:100px; 
            left:50%; 
            transform:translateX(-50%); 
            background:rgba(30,144,255,0.9); 
            color:#000; 
            padding:10px 20px; 
            border-radius:20px; 
            font-weight:bold; 
            z-index:2000; 
            white-space:nowrap; 
            pointer-events:none; 
            box-shadow:0 4px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>Player Profiles</h1>
    </header>

    <div class="search-container">
        <input id="playerInput" type="text" placeholder="Search Player..." autocomplete="off">
        <div id="autocomplete-list" class="autocomplete-items"></div>
    </div>

    <div id="statsBox">
        <div class="profile-header">
            <div class="photo-container">
                <img id="playerPhoto" src="" alt="">
                <div id="playerRank"></div>
            </div>
            <h2 id="playerName"></h2>
            <div id="handicapTag" class="handicap-tag"></div>
            
            <div id="badgeShelf" class="badge-shelf"></div>
        </div>

        <div id="statCards" class="stat-grid"></div>
        
        <a class="nav-btn" href="allstatssplash.html">Back to Stats</a>
    </div>

    <footer>
        <img src="white transparent.png" alt="ROPL" class="footer-logo">
    </footer>
</div>

<div id="statModal">
    <div class="modal-content">
        <h2 id="modalTitle" style="color: var(--brand-blue);"></h2>
        <div id="modalBody"></div>
        <button class="close-btn" onclick="closeModal()">Close</button>
    </div>
</div>

<div id="badgeToast"></div>

<script>
    const input = document.getElementById('playerInput');
    const list = document.getElementById('autocomplete-list');

    input.addEventListener('input', function() {
        const val = this.value.toLowerCase();
        list.innerHTML = '';
        if (!val) return;

        const matches = playerData
            .filter(p => p["Player Name"].toLowerCase().startsWith(val))
            .sort((a, b) => a["Player Name"].localeCompare(b["Player Name"]));

        matches.forEach(player => {
            const item = document.createElement('div');
            item.textContent = player["Player Name"];
            item.onclick = () => selectPlayer(player);
            list.appendChild(item);
        });
    });

    function selectPlayer(player) {
        const name = player["Player Name"];
        document.getElementById('playerName').textContent = name;
        document.getElementById('handicapTag').textContent = `Handicap ${player["Handicap"]}`;
        document.getElementById('playerRank').textContent = `#${player["Player #"] || '?'}`;
        
        const photo = document.getElementById('playerPhoto');
        photo.src = `photos/${encodeURIComponent(name)}.jpg`;
        photo.onerror = () => photo.src = 'photos/default.jpg';
        
        renderBadges(player);
        renderStatCards(player);

        document.getElementById('statsBox').style.display = 'block';
        list.innerHTML = '';
        input.value = '';
        window.scrollTo(0, 0);
    }

  function renderBadges(player) {
        const shelf = document.getElementById('badgeShelf');
        shelf.innerHTML = '';
        
        const iconWrapper = document.createElement('div');
        iconWrapper.className = 'badge-icons';
        
        const badgeInfo = {            
            "🐣": "Novice (1+ Games)", "📖": "Student (25+ Games)", "🎓": "Graduate (100+ Games)",
            "🥈": "Professional (200+ Games)", "🥇": "Veteran (300+ Games)", "💎": "Master (400+ Games)",
            "👑": "Legend (500+ Games)", "🐐": "G.O.A.T. (1000+ Games)", "🤝": "Contributor (1+ Matches Won)",
            "🥉": "Competitor (10+ Matches Won)", "🎗️": "Valued (20+ Matches Won)", "⚓": "Anchor (50+ Matches Won)",
            "🧩": "Irreplaceable (100+ Matches Won)", "🌡️": "Heating Up (5+ Streak)", "🔥": "On Fire (10+ Streak)",
            "☄️": "Burning Up (15+ Streak)", "🚫": "Unstoppable (20+ Streak)", "💥": "Super Nova (32+ Streak)",
            "🧲": "Lucky (1+ 8 on Break)", "✒️": "Educated (10+ 8 on Break)","🎯": "Skilled (10+ 8 on Break)", "🧙‍♂️": "Master (20+ 8 on Break)",
            "📸": "Flashy (1+ Break & Run)", "🧱": "Solid (5+ Break & Run)", "😨": "Scary (10+ Break & Run)",
            "👹": "Monster (20+ Break & Run)", "💀": "Demon (50+ Break & Run)", "⭐": "Stellar (1+ Mini-Slam)",
            "👽": "Otherwordly (3+ Mini-Slam)", "🌌": "Galactic (5+ Mini-Slam)"          
        };

        const g = parseInt(player["Games Played"]) || 0;
        const w = parseInt(player["Matches Won"]) || 0;
        const s = parseInt(player["Longest Win Streak"]) || 0;
        const b = parseInt(player["Break and Run"]) || 0;
        const o = parseInt(player["8 on Break"]) || 0;
        const m = parseInt(player["Mini-Slam"]) || 0;

        let totalCount = 0;
        let displayIcons = [];

        // --- 1. GAMES PLAYED ---
        let gamesBadges = [];
        if (g >= 1) gamesBadges.push("🐣");
        if (g >= 25) gamesBadges.push("📖");
        if (g >= 100) gamesBadges.push("🎓");
        if (g >= 200) gamesBadges.push("🥈");
        if (g >= 300) gamesBadges.push("🥇");
        if (g >= 400) gamesBadges.push("💎");
        if (g >= 500) gamesBadges.push("👑");
        if (g >= 1000) gamesBadges.push("🐐");
        totalCount += gamesBadges.length;
        if (gamesBadges.length > 0) displayIcons.push(gamesBadges.pop());

        // --- 2. WINS ---
        let winsBadges = [];
        if (w >= 1) winsBadges.push("🤝");
        if (w >= 10) winsBadges.push("🥉");
        if (w >= 20) winsBadges.push("🎗️");
        if (w >= 50) winsBadges.push("⚓");
        if (w >= 100) winsBadges.push("🧩");
        totalCount += winsBadges.length;
        if (winsBadges.length > 0) displayIcons.push(winsBadges.pop());

        // --- 3. STREAKS ---
        let streakBadges = [];
        if (s >= 5) streakBadges.push("🌡️");
        if (s >= 10) streakBadges.push("🔥");
        if (s >= 15) streakBadges.push("☄️");
        if (s >= 20) streakBadges.push("🚫");
        if (s >= 32) streakBadges.push("💥");
        totalCount += streakBadges.length;
        if (streakBadges.length > 0) displayIcons.push(streakBadges.pop());

        // --- 4. 8 ON BREAK ---
        let oBadges = [];
        if (o >= 1) oBadges.push("🧲");
      if (o >= 5) oBadges.push("✒️");
        if (o >= 10) oBadges.push("🎯");
        if (o >= 20) oBadges.push("🧙‍♂️");
        totalCount += oBadges.length;
        if (oBadges.length > 0) displayIcons.push(oBadges.pop());

        // --- 5. BREAK & RUN ---
        let bBadges = [];
        if (b >= 1) bBadges.push("📸");
        if (b >= 5) bBadges.push("🧱");
        if (b >= 10) bBadges.push("😨");
        if (b >= 20) bBadges.push("👹");
        if (b >= 50) bBadges.push("💀");
        totalCount += bBadges.length;
        if (bBadges.length > 0) displayIcons.push(bBadges.pop());

        // --- 6. MINI-SLAMS ---
        let mBadges = [];
        if (m >= 1) mBadges.push("⭐");
        if (m >= 3) mBadges.push("👽");
        if (m >= 5) mBadges.push("🌌");
        totalCount += mBadges.length;
        if (mBadges.length > 0) displayIcons.push(mBadges.pop());

        if (totalCount === 0) {
            shelf.innerHTML = '<span style="color:#444; font-size:0.8rem;">No Badges Earned Yet</span>';
            return;
        }

        // Render only the TOP icons
        displayIcons.forEach(icon => {
            const span = document.createElement('span');
            span.className = 'badge-mini';
            span.textContent = icon;
            span.onclick = () => {
                const toast = document.getElementById('badgeToast');
                toast.textContent = badgeInfo[icon];
                toast.style.display = 'block';
                clearTimeout(window.badgeTimeout);
                window.badgeTimeout = setTimeout(() => { toast.style.display = 'none'; }, 2000);
            };
            iconWrapper.appendChild(span);
        });

        shelf.appendChild(iconWrapper);

        // Display the total cumulative count
        const countDisplay = document.createElement('div');
        countDisplay.className = 'badge-count-text';
        countDisplay.textContent = `Badge Count: ${totalCount}`;
        shelf.appendChild(countDisplay);
    }
    function renderStatCards(player) {
        const container = document.getElementById('statCards');
        container.innerHTML = '';

        for (const key in player) {
            if (["Player Name", "HC", "Handicap", "Player #"].includes(key)) continue;

            const card = document.createElement('div');
            card.className = 'stat-card';
            card.onclick = () => showTop10(key);
            card.innerHTML = `
                <span class="stat-label">${key}</span>
                <span class="stat-value">${player[key]}</span>
            `;
            container.appendChild(card);
        }
    }

    function showTop10(statKey) {
        const lowerIsBetter = ["Life Hash", "White Washed"];
        const minMPStats = ["Match Win %", "Game Win %", "Life Hash", "% Weeks w/8OB, BR or Rackless", "White Washed"];

        const ranked = playerData
            .filter(p => minMPStats.includes(statKey) ? p["Matches Played"] >= 25 : true)
            .map(p => ({
                name: p["Player Name"],
                value: parseFloat(typeof p[statKey] === "string" ? p[statKey].replace('%', '') : p[statKey])
            }))
            .filter(p => !isNaN(p.value))
            .sort((a, b) => lowerIsBetter.includes(statKey) ? a.value - b.value : b.value - a.value)
            .slice(0, 10);

        const modalBody = document.getElementById('modalBody');
        document.getElementById('modalTitle').textContent = statKey;

        let tableHtml = `<table><tr><th>#</th><th>Player</th><th>Value</th></tr>`;
        ranked.forEach((p, i) => {
            tableHtml += `<tr><td class="rank-col">${i+1}</td><td>${p.name}</td><td>${p.value}</td></tr>`;
        });
        tableHtml += `</table>`;
        
        modalBody.innerHTML = tableHtml;
        document.getElementById('statModal').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('statModal').style.display = 'none';
    }
</script>
</body>
</html>
