<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROPL Badge Cabinet</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 10px; }
        .cabinet-wrapper { max-width: 420px; margin: 0 auto; border: 3px solid #1e90ff; border-radius: 12px; padding: 15px; min-height: 90vh; background: #050505; }
        
        h1 { color: #1e90ff; text-transform: uppercase; letter-spacing: 1px; font-size: 1.5rem; margin: 10px 0; }
        select { width: 100%; padding: 10px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; font-size: 1rem; margin-bottom: 15px; }
        
        /* 3-Column Grid for high volume */
        .badge-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 8px; 
            margin-top: 10px; 
        }
        
        /* Compact Badge Styling */
      .badge { 
            background: #111; 
            border: 1px solid #222; 
            border-radius: 8px; 
            padding: 10px 5px; 
            /* Changed from 0.15 to 0.45 for better visibility */
            opacity: 0.45; 
            filter: grayscale(1); 
            transition: all 0.4s ease;
        }
        
        .badge.unlocked { 
            opacity: 1; 
            filter: grayscale(0); 
            border-color: #ffd700; 
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2); 
            background: #151515;
        }
        
      .badge-icon { font-size: 1.8rem; margin-bottom: 4px; }
        .badge-name { 
            font-weight: bold; 
            color: #fff; 
            font-size: 0.65rem; 
            text-transform: uppercase; 
            display: block; 
            height: 18px; 
            overflow: hidden; 
        }
        .badge-desc { 
            font-size: 0.55rem; 
            color: #888; 
            margin-top: 2px; 
            line-height: 1.1; 
        }

        .back-btn { display: inline-block; margin-top: 25px; color: #1e90ff; text-decoration: none; font-weight: bold; font-size: 0.8rem; border: 1px solid #1e90ff; padding: 8px 16px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="cabinet-wrapper">
    <h1>🏆 BADGES</h1>
    
    <select id="player-select" onchange="loadBadges()">
        <option value="">-- SELECT PLAYER --</option>
    </select>

    <div id="badge-container" class="badge-grid">
        <div id="badge-100-games" class="badge">
            <div class="badge-icon">💯</div>
            <span class="badge-name">Centurion</span>
            <div class="badge-desc">100+ Games</div>
        </div>

        <div id="badge-streak" class="badge">
            <div class="badge-icon">🔥</div>
            <span class="badge-name">On Fire</span>
            <div class="badge-desc">5+ Win Streak</div>
        </div>
        
        </div>

    <a href="index.html" class="back-btn">RETURN TO MENU</a>
</div>

<script src="playerdata.js"></script>

<script>
    window.onload = () => {
        const select = document.getElementById('player-select');
        if (typeof playerData !== 'undefined') {
            const sorted = [...playerData].sort((a, b) => a["Player Name"].localeCompare(b["Player Name"]));
            sorted.forEach(p => {
                let opt = document.createElement('option');
                opt.value = p["Player Name"];
                opt.textContent = p["Player Name"];
                select.appendChild(opt);
            });
        }
    };

    function loadBadges() {
        const selectedName = document.getElementById('player-select').value;
        const player = playerData.find(p => p["Player Name"] === selectedName);
        
        document.querySelectorAll('.badge').forEach(b => b.classList.remove('unlocked'));

        if (!player) return;

        // Centurion Logic
        if (parseInt(player["Games Played"]) >= 100) {
            document.getElementById('badge-100-games').classList.add('unlocked');
        }

        // Win Streak Logic
        if (parseInt(player["Longest Win Streak"]) >= 5) {
            document.getElementById('badge-streak').classList.add('unlocked');
        }
    }
</script>

</body>
</html>
