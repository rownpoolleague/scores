<!DOCTYPE html>
<html>
<head>
    <title>Debug Test</title>
</head>
<body style="background: #222; color: #fff; font-family: sans-serif;">

    <h1>Data Connection Test</h1>
    <div id="test-output">Waiting for data...</div>

    <script src="master.js"></script>

    <script>
        const display = document.getElementById('test-output');

        if (typeof masterlist !== 'undefined') {
            // If it finds the list, show the first player's name
            const firstName = masterlist[0]["Player Name"];
            display.innerHTML = "Success! Found: " + firstName;
            display.style.color = "lime";
        } else {
            // If it fails, show this
            display.innerHTML = "FAILED: 'masterlist' is still undefined.";
            display.style.color = "red";
        }
    </script>

</body>
</html>
