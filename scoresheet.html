<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scoresheet</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* --- Styles unchanged from your version --- */
body { font-family: Arial, sans-serif; font-size: 18px; background-color: #000; color: #fff; }
.row { display: flex; justify-content: center; gap: 40px; margin-top: 40px;font-size:22px; }
.block { text-align: center; }
.roster-box { text-align: left; width:180px; margin-top: 10px; padding: 8px 10px; border: 1px solid #000; min-width:1px; min-height:1px; font-size:22px; white-space:pre-line; background-color:#000; color:#fff; }
label { font-weight:bold; color:#fff; font-size:20px; }
.playerName { cursor:pointer; padding:2px 0; }
.playerName:hover { background-color:#333; }
h3 { margin:0 0 8px 0; color:#fff; }
input[type="number"] { width:35px; padding:4px 6px; font-size:20px; background-color:#fff; color:#000; border:1px solid #fff; border-radius:4px; margin-bottom:6px; text-align:center; }
.stat-row { display:flex; flex-direction:column; align-items:center; margin-bottom:12px; }
.stat-row label { width:auto; text-align:center; margin-bottom:4px; }
.center-label { display:flex; flex-direction:column; align-items:center; }
select, input, button { font-size:inherit; font-family:inherit; }
.form-wrapper {
    width: 100%; /* Spans full width */
    padding: 2px;
    border: 4px solid #1e90ff;
    border-radius: 0; /* Optional: remove radius for true edge-to-edge look */
    box-sizing: border-box; /* Crucial: includes padding/border in 100% width */
}

.playerName {
  display: flex;           /* allow name and HC to be on same line */
  justify-content: space-between; /* push HC to right */
  padding: 2px 0;
  cursor: pointer;
}

.playerName span.hc {
  color: #fff;             /* lighter color for HC */
  -weight: normal;
}
  #lagWinnerHeader,
#lagLoserHeader {
    font-size: 18px;
    margin-bottom: 10px;
}
    .button-row {
    display: flex;         /* Align buttons in a row */
    justify-content: space-between; /* Evenly space them */
    gap: 5px;              /* Tiny gap between buttons */
    width: 100%;           /* Fill the container */
    margin-top: 20px;
    box-sizing: border-box;
}

.button-row button {
    flex: 1;               /* Forces all 4 buttons to be exactly the same width */
    height: 40px;
    font-size: 18px;       /* Slightly smaller to ensure "Transfer" fits on small phones */
    padding: 0;            /* Remove internal padding to save space */
    text-align: center;
    white-space: nowrap;   /* Prevents text from wrapping to a second line */
}
/* MOBILE STYLES */
@media (max-width:600px) {
.row { flex-direction:column; gap:20px; margin-top:20px; align-items:center; text-align:center; }
.form-wrapper { margin:1px;}
.roster-box { 
    text-align: left; 
    width: 90%;       /* take up most of the screen on mobile */
    max-width: 300px; /* optional: don’t let it get too wide on large phones */
    margin: 0 auto;   /* center it horizontally */
  }
}
.button-row button {font-size: 14px;}
.lag-row {gap:10px; width:100%; margin-top:20px; align-items:center; text-align:center;display: none;}
.stat-row { display:flex; flex-direction:column; align-items:center; margin-bottom:12px; }
.stat-row label { width:auto; text-align:center; margin-bottom:4px; }
.player-stats-container { position:relative; display:flex; justify-content:center; gap:60px; }
.player-stats-container::after { content:""; position:absolute; top:0; bottom:0; left:50%; transform:translateX(-50%); width:2px; background-color:#fff; opacity:0.7; pointer-events:none; }
.back-button { display: block; margin: 15px auto 0 auto; background-color: #1e90ff; color: #fff; border-radius: 6px; text-decoration: none; font-size: 24px; text-align: center; }
 /* Floating timer box */
#timerBox {
  display: none;
  width:125px;
  top: 50%;
  right: calc(50% - 10px); /* ← nudge RIGHT */
  background: #000;
  color: #fff;
  border-radius: 8px;
  border-color: #1e90ff;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  z-index: 1000;
}
  #timerValue {
    font-size: 1.5em;
    font-weight: bold;
  }
  .closeBtn {
    background: crimson;
    border: none;
    color: white;
    margin-left: 10px;
    border-radius: 4px;
    cursor: pointer;
  }
  .startBtn {
    font-size: 1em;
    cursor: pointer;
  }
    /* Spinner Overlay */
#loadingOverlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.8);
    z-index: 10000;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
}

.spinner {
    width: 50px;
    height: 50px;
    border: 5px solid #333;
    border-top: 5px solid #1e90ff; /* Theme blue */
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 15px;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
    #qrModal {
    z-index: 1000000 !important; /* One level higher than your history modal */
}
    /* Modal background overlay */
.modal {
    display: none; /* now controlled by CSS, not inline */
    position: fixed;
    inset: 0;
    background: black;
    z-index: 9999;

    /* Center the modal box */
    display: flex;
    justify-content: center;
    align-items: center;
}
.modal-content {
    background: #111;
    color: #fff;
    padding: 20px 30px;
    border-radius: 10px;
    border: 2px solid #1e90ff;
    width: 80%;
    max-width: 320px;
    text-align: center;
}
</style>

</head>

      <div class="stat-row">
            <label>Wins</label>
            <div class="innings-wrapper">

               </div>

           style="display: inline-block;
                  box-sizing: border-box; 
                  text-align: center;

  <div style="background:#fff; padding:20px; border-radius:8px; position:relative; max-width:90%; max-height:90%; overflow:auto;">

    <script>
let pendingLagPlayer = "";
let pendingHC = "";
let isLoading = false;
const FORM_KEY = "scoresheetData";
let scores = JSON.parse(localStorage.getItem("teamMatchScores")) || { home: 0, away: 0 };

// 1. Populate roster when team selects
function updateRoster(sel, div) {
    if (!sel || !sel.value) {
        div.innerHTML = "";
        return;
    }
    const rosterData = scoresheetinfo[sel.value] || [];
    div.innerHTML = rosterData.map(p => {
        const lookupHC = scoresheetrosters[p];
        const hc = (lookupHC !== undefined && lookupHC !== 0) ? lookupHC : 3;
        return `<div class="playerName" data-p="${p}" data-hc="${hc}">
                    <span class="name">${p}</span>
                    <span class="hc">${hc}</span>
                </div>`;
    }).join("");
}

// 2. Event Listeners for Team Selection
document.addEventListener("change", e => {
    if (e.target.id === "team") updateRoster(e.target, document.getElementById("teamRoster"));
    if (e.target.id === "opponent") updateRoster(e.target, document.getElementById("opponentRoster"));
});

// 3. Player Selection (Lag Modal) Logic
document.addEventListener("click", e => {
    const playerDiv = e.target.closest(".playerName");
    if (!playerDiv) return;

    pendingLagPlayer = playerDiv.getAttribute("data-p");
    pendingHC = playerDiv.getAttribute("data-hc");

    const span = document.getElementById("lagPlayerName");
    if (span) span.textContent = pendingLagPlayer;
    
    openModal('lagModal');
});

function assignLag(didWin) {
    if (didWin) {
        document.getElementById("lagWinner").value = pendingLagPlayer;
        document.getElementById("pA_hc").value = pendingHC;
        document.getElementById("lagWinnerHeader").textContent = pendingLagPlayer;
    } else {
        document.getElementById("lagLoser").value = pendingLagPlayer;
        document.getElementById("pB_hc").value = pendingHC;
        document.getElementById("lagLoserHeader").textContent = pendingLagPlayer;
    }
    updateMatchWinner();
    closeModal('lagModal');
    saveNow();
}

// 4. Modal Controls
function openModal(id) {
    const modal = document.getElementById(id);
    if (modal) {
        modal.style.display = "flex";
        document.body.style.overflow = "hidden";
    }
}

function closeModal(id) {
    const modal = document.getElementById(id);
    if (modal) {
        modal.style.display = "none";
        document.body.style.overflow = "auto";
    }
}

// 5. Stat Increment/Decrement
function changeInnings(amount) {
    let input = document.getElementById("matchInnings");
    let val = Math.max(0, (parseInt(input.value) || 0) + amount);
    input.value = val;
    const displayStyle = (val > 0) ? "none" : "block";
    document.getElementById("teamRoster").style.display = displayStyle;
    document.getElementById("opponentRoster").style.display = displayStyle;
    saveNow();
}

function changeWinsA(amount) {
    let input = document.getElementById("pA_wins");
    input.value = Math.max(0, (parseInt(input.value) || 0) + amount);
    updateMatchWinner();
    saveNow();
}

function changeWinsB(amount) {
    let input = document.getElementById("pB_wins");
    input.value = Math.max(0, (parseInt(input.value) || 0) + amount);
    updateMatchWinner();
    saveNow();
}

// Helper stat functions
function changePASafeties(amount) { let i = document.getElementById("pA_safeties"); i.value = Math.max(0, (parseInt(i.value) || 0) + amount); saveNow(); }
function changePA8B(amount) { let i = document.getElementById("pA_b8"); i.value = Math.max(0, (parseInt(i.value) || 0) + amount); saveNow(); }
function changePABR(amount) { let i = document.getElementById("pA_br"); i.value = Math.max(0, (parseInt(i.value) || 0) + amount); saveNow(); }
function changePAHC(amount) { let i = document.getElementById("pA_hc"); i.value = Math.max(0, (parseInt(i.value) || 0) + amount); updateMatchWinner(); saveNow(); }
function changePAE8(amount) { let i = document.getElementById("pA_e8"); i.value = Math.max(0, (parseInt(i.value) || 0) + amount); saveNow(); }
function changePBHC(amount) { let i = document.getElementById("pB_hc"); i.value = Math.max(0, (parseInt(i.value) || 0) + amount); updateMatchWinner(); saveNow(); }
function changePBsafeties(amount) { let i = document.getElementById("pB_safeties"); i.value = Math.max(0, (parseInt(i.value) || 0) + amount); saveNow(); }
function changePB8B(amount) { let i = document.getElementById("pB_b8"); i.value = Math.max(0, (parseInt(i.value) || 0) + amount); saveNow(); }
function changePBBR(amount) { let i = document.getElementById("pB_br"); i.value = Math.max(0, (parseInt(i.value) || 0) + amount); saveNow(); }
function changePBE8(amount) { let i = document.getElementById("pB_e8"); i.value = Math.max(0, (parseInt(i.value) || 0) + amount); saveNow(); }

// 6. Match Winner & UI
function updateMatchWinner() {
    const aWins = parseInt(document.getElementById("pA_wins").value) || 0;
    const bWins = parseInt(document.getElementById("pB_wins").value) || 0;
    const aHC = parseInt(document.getElementById("pA_hc").value) || 0;
    const bHC = parseInt(document.getElementById("pB_hc").value) || 0;
    const winField = document.getElementById("matchWinner");
    const subBtn = document.getElementById("submitMatch");

    if (aWins === aHC && aHC > 0) {
        winField.value = document.getElementById("lagWinner").value;
    } else if (bWins === bHC && bHC > 0) {
        winField.value = document.getElementById("lagLoser").value;
    } else {
        winField.value = "";
    }
    subBtn.style.display = winField.value ? "inline-block" : "none";
}

function updateScoreUI() {
    document.getElementById("homeScore").textContent = scores.home;
    document.getElementById("awayScore").textContent = scores.away;
}

// 7. Save/Load
function saveNow() {
    if (isLoading) return;
    const ids = ["team","opponent","lagWinner","lagLoser","matchInnings","matchWinner","pA_hc","pA_wins","pA_safeties","pA_b8","pA_br","pA_e8","pB_hc","pB_wins","pB_safeties","pB_b8","pB_br","pB_e8","pA_coach","pB_coach","matchNotes"];
    const data = {};
    ids.forEach(id => {
        const el = document.getElementById(id);
        if (el) data[id] = el.type === "checkbox" ? el.checked : el.value;
    });
    data.lwH = document.getElementById("lagWinnerHeader").textContent;
    data.llH = document.getElementById("lagLoserHeader").textContent;
    localStorage.setItem(FORM_KEY, JSON.stringify(data));
    localStorage.setItem("teamMatchScores", JSON.stringify(scores));
}

function loadScoresheet() {
    const raw = localStorage.getItem(FORM_KEY);
    if (!raw) return;
    isLoading = true;
    const data = JSON.parse(raw);
    Object.keys(data).forEach(id => {
        const el = document.getElementById(id);
        if (el) {
            if (el.type === "checkbox") el.checked = data[id];
            else el.value = data[id];
        }
    });
    if (data.lwH) document.getElementById("lagWinnerHeader").textContent = data.lwH;
    if (data.llH) document.getElementById("lagLoserHeader").textContent = data.llH;
    
    updateRoster(document.getElementById("team"), document.getElementById("teamRoster"));
    updateRoster(document.getElementById("opponent"), document.getElementById("opponentRoster"));
    updateMatchWinner();
    updateScoreUI();
    isLoading = false;
}

// 8. Initialization
window.addEventListener("DOMContentLoaded", () => {
    loadScoresheet();
});

// History & Manual Player logic preserved from your file
function showHistory() {
    const history = JSON.parse(localStorage.getItem("matchHistory")) || [];
    const tbody = document.getElementById("historyTableBody");
    tbody.innerHTML = history.length === 0 ? '<tr><td colspan="3">No matches.</td></tr>' : 
        history.map((m, i) => `<tr><td>Match ${i+1}</td><td>${m.pA.wins}-${m.pB.wins}</td><td>${m.matchInnings}</td></tr>`).join("");
    openModal("historyModal");
}

function addNewPlayerManual() {
    const home = document.getElementById("team").value;
    const away = document.getElementById("opponent").value;
    if(!home || !away) return alert("Select teams first");
    document.getElementById("homeLabel").textContent = home;
    document.getElementById("awayLabel").textContent = away;
    openModal("playerModal");
}

function confirmNewPlayer() {
    const name = document.getElementById("manualPlayerName").value.trim();
    if (!name) return;
    const side = document.querySelector('input[name="npTeam"]:checked').value;
    const teamName = document.getElementById(side === 'home' ? "team" : "opponent").value;
    if (!scoresheetinfo[teamName]) scoresheetinfo[teamName] = [];
    scoresheetinfo[teamName].push(name);
    localStorage.setItem("manual_roster_additions", JSON.stringify(scoresheetinfo));
    updateRoster(document.getElementById(side === 'home' ? "team" : "opponent"), document.getElementById(side === 'home' ? "teamRoster" : "opponentRoster"));
    closePlayerModal();
}
// ... [Remaining utility functions: closeHistory, clearHistory, exportScoresheet, startTimer, etc. remain the same]
</script>
