<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scoresheet</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="scoresheetrosters.js"></script>
<script src="scoresheetinfo.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
<script src="schedule.js"></script>
<script src="playerdata.js"></script>
<style>
body { font-family: Arial, sans-serif; font-size: 18px; background-color:black; color: #fff; margin: 0; padding: 0; }
.form-wrapper { background-image: url('https://raw.githubusercontent.com/rownpoolleague/scores/main/photos/table.png'); background-size: 100% 100%; background-position: center; background-repeat: no-repeat; width: 100%; max-width: 550px; margin: 0 auto; padding: 10px; border: 1px solid transparent; box-sizing: border-box; min-height: 95dvh; display: flex; flex-direction: column; }
.row { display: flex; justify-content: center; gap: 5px; margin-top: 10px; font-size: 17px; flex-wrap: wrap; }
.block { flex: 1; max-width: 50%; text-align: center; overflow-wrap: break-word; }
.roster-box { text-align: left; width: 100%; margin: 10px auto; padding: 8px 6px; font-size: 18px; white-space: pre-line; background-color: #000; color: #fff; font-weight: bold; box-sizing: border-box; }
#lagWinnerHeader, #lagLoserHeader { font-size: 18px; visibility: hidden; margin-bottom: 10px; color: #FFCC33; }
#lagWinnerHeader.active, #lagLoserHeader.active { visibility: visible; }
label { font-weight: bold; color: #fff; font-size: 20px; }
h3 { margin: 0 0 8px 0; color: #fff; }
input[type="number"] { width: 35px; padding: 4px 6px; font-size: 20px; background-color: #fff; color: #000; border: 1px solid #fff; border-radius: 4px; text-align: center; outline: none; }
.innings-wrapper { display: flex; align-items: center; justify-content: center; gap: 5px; }
.stat-row { display: flex; flex-direction: column; align-items: center; margin-bottom: 8px; -webkit-tap-highlight-color: transparent; }
.playerName { display: flex; justify-content: space-between; padding: 4px 0; cursor: pointer; }
.playerName:hover { background-color: #333; }
.playerName span.hc { color: #fff; font-weight: normal; }
.uiButton { padding: 10px 20px; font-size: 20px; cursor: pointer; border-radius: 6px; border: none; background-color: #1e90ff; color: white; display: block; margin: 20px auto; }
.back-button { display: block; background-color:transparent; color: #fff; text-decoration: none; font-size: 24px; text-align: center; padding: 10px 0; width: 100%; max-width: 550px; margin: 10px auto; height: 30px; }
.uiText { font-size: 22px; text-align: center; margin: 10px auto; display: block; color: gold; }
.button-row button {
  flex: 1;
  height: 40px;
  font-size: 16px;
  font-weight: bold;
  padding: 0;
  text-align: center;
  white-space: nowrap;
  cursor: pointer;
  background: transparent;
  color: gold;
  border: none !important;
  outline: none !important;
  box-shadow: none !important;
  -webkit-appearance: none;
  appearance: none;
}
.button-row button { flex: 1; height: 40px; font-size: 16px; font-weight:bold;padding: 0; text-align: center; white-space: nowrap; cursor: pointer; background-color:transparent; color: gold; }
#timerBox { display: none; position: fixed; width: 130px; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #000; color: #fff; padding: 15px; border-radius: 8px; border: 2px solid #1e90ff; box-shadow: 0 4px 20px rgba(0,0,0,0.8); z-index: 10000; text-align: center; }
#timerValue { font-size: 1.8em; font-weight: bold; display: block; margin-bottom: 5px; }
.closeBtn { background: crimson; border: none; color: white; border-radius: 4px; cursor: pointer; padding: 5px 10px; }
.player-stats-container { position: relative; display: flex; justify-content: center; gap: 40px; }
.player-stats-container::after { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: 2px; background-color: #fff; opacity: 0.5; pointer-events: none; }
#loadingOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); z-index: 10000; flex-direction: column; justify-content: center; align-items: center; color: white; }
.spinner { width: 50px; height: 50px; border: 5px solid #333; border-top: 5px solid #1e90ff; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
#masterModal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9); justify-content: center; align-items: center; z-index: 100000; padding: 10px; }
.modal-container { background: #111; padding: 20px; border: 2px solid #1e90ff; border-radius: 12px; width: 100%; max-width: 450px; max-height: 85vh; display: flex; flex-direction: column; box-sizing: border-box; box-shadow: 0 0 20px rgba(30, 144, 255, 0.3); }
#modalContent { overflow-y: auto; margin-bottom: 20px; color: #fff; scrollbar-width: thin; scrollbar-color: #1e90ff #111; }
#modalFooter { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
#modalFooter button { padding: 10px 18px; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; }
@keyframes spin { 100% { transform: rotate(360deg); } }
#ticker-container { display: none; position: fixed; top: 0; left: 0; width: 100%; background: #c00; color: #fff; padding: 10px 0; font-weight: bold; z-index: 200000; overflow: hidden; white-space: nowrap; border-bottom: 2px solid gold; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
#ticker-text { display: inline-block; padding-left: 100%; animation: ticker-kb 25s linear infinite; }
@keyframes ticker-kb { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
#score-board { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 450px; background: #111; color: #fff; border: 3px solid gold; padding: 20px; z-index: 10001; max-height: 80vh; overflow-y: auto; box-shadow: 0 0 30px rgba(0,0,0,0.9); text-align: center; }
.score-row { border-bottom: 1px solid #333; padding: 8px 0; font-size: 14px; }
.score-close { margin-top: 20px; color: gold; cursor: pointer; font-weight: bold; text-decoration: underline; }
.team-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
.team-table th { border-bottom: 2px solid gold; color: gold; padding: 10px; }
.team-table td { padding: 8px; border-bottom: 1px solid #333; }
@media (max-width:600px) {
    .roster-box { width: 95%; }
    .button-row button { font-size: 12px; }
}
</style>
</head>
<body>

<div id="ticker-container"><div id="ticker-text"></div></div>

<div id="loadingOverlay">
    <div class="spinner"></div>
    <div>Submitting Results...</div>
</div>

<div id="masterModal"></div>
<div id="score-board"></div>

<div class="form-wrapper">
    <div id="matchHeader" style="text-align:center; margin:10px 0 20px;">
        <div onclick="secretHandshake()" style="display:flex; justify-content:center; gap:12px; font-size:22px; font-weight:bold; cursor:pointer; user-select:none;">
            <div id="weekDisplay"></div>
            <div id="dateDisplay"></div>
        </div>
    </div>

    <div class="row">
        <div class="block">
            <select id="team">
                <option value="">Select Home Team</option>
                <option>1 Halfway Crooks</option><option>2 Haters Welcome</option><option>3 Lynn's Amigos</option><option>4 Only Here For an Alibi</option><option>5 Dirty Ballers</option><option>6 8 on Break</option><option>7 Five Amigos</option><option>8 Frank's Pizza</option><option>9 Killer Instinct</option><option>10 Pete's Bunch</option>
            </select>
            <div id="teamRoster" class="roster-box"></div>
        </div>
        <div class="block">
            <select id="opponent">
                <option value="">Select Away Team</option>
                <option>1 Halfway Crooks</option><option>2 Haters Welcome</option><option>3 Lynn's Amigos</option><option>4 Only Here For an Alibi</option><option>5 Dirty Ballers</option><option>6 8 on Break</option><option>7 Five Amigos</option><option>8 Frank's Pizza</option><option>9 Killer Instinct</option><option>10 Pete's Bunch</option>
            </select>
            <div id="opponentRoster" class="roster-box"></div>
        </div>
    </div>

    <p id="statusText" class="uiText">Tap a Player to Set Lag Winner</p>
    
    <div class="lag-row" style="display:none; justify-content:center; gap:40px; margin-top:10px;">
        <div class="center-label">
            <label>Lag Winner</label>
            <input id="lagWinner" readonly style="width:135px; text-align:center; margin-top:10px;">
        </div>
        <div class="center-label">
            <label>Lag Loser</label>
            <input id="lagLoser" readonly style="width:135px; text-align:center;">
        </div>
    </div>
   
    <div id="playerNamesHeader" style="display:flex; justify-content:center; gap:30px; text-align:center; align-items:center;">
        <h3 id="lagWinnerHeader" class="block" style="margin:0;">Lag Winner</h3>    
        <h3 id="lagLoserHeader" class="block" style="margin:0;">Lag Loser</h3>
    </div>

    <div id="gamePlayArea" style="display:none;">
        <div class="player-stats-container" style="margin-top:10px;">
            <div class="block">
                <div class="stat-row"><label>HC</label><div class="innings-wrapper"><button onclick="changeStat('pA_hc',-1)">−</button><input id="pA_hc" type="number" value="0" readonly><button onclick="changeStat('pA_hc',1)">+</button></div></div>
                <div class="stat-row"><label>Wins</label><div class="innings-wrapper"><button onclick="changeStat('pA_wins',-1)">−</button><input id="pA_wins" type="number" value="0" readonly><button onclick="changeStat('pA_wins',1)">+</button></div></div>
                <div class="stat-row"><label>Safeties</label><div class="innings-wrapper"><button onclick="changeStat('pA_safeties',-1)">−</button><input id="pA_safeties" type="number" value="0" readonly><button onclick="changeStat('pA_safeties',1)">+</button></div></div>
                <div class="stat-row"><label>8B</label><div class="innings-wrapper"><button onclick="changeStat('pA_b8',-1)">−</button><input id="pA_b8" type="number" value="0" readonly><button onclick="changeStat('pA_b8',1)">+</button></div></div>
                <div class="stat-row"><label>B+R</label><div class="innings-wrapper"><button onclick="changeStat('pA_br',-1)">−</button><input id="pA_br" type="number" value="0" readonly><button onclick="changeStat('pA_br',1)">+</button></div></div>
                <div class="stat-row"><label>E8</label><div class="innings-wrapper"><button onclick="changeStat('pA_e8',-1)">−</button><input id="pA_e8" type="number" value="0" readonly><button onclick="changeStat('pA_e8',1)">+</button></div></div>
                <div class="stat-row"><label>Coach</label><input type="checkbox" id="pA_coach" onchange="saveNow()"></div>
            </div>
            <div class="block">
                <div class="stat-row"><label>HC</label><div class="innings-wrapper"><button onclick="changeStat('pB_hc',-1)">−</button><input id="pB_hc" type="number" value="0" readonly><button onclick="changeStat('pB_hc',1)">+</button></div></div>
               <div class="stat-row"><label>Wins</label><div class="innings-wrapper"><button onclick="changeStat('pB_wins',-1)">−</button><input id="pB_wins" type="number" value="0" readonly><button onclick="changeStat('pB_wins',1)">+</button></div></div>
                <div class="stat-row"><label>Safeties</label><div class="innings-wrapper"><button onclick="changeStat('pB_safeties',-1)">−</button><input id="pB_safeties" type="number" value="0" readonly><button onclick="changeStat('pB_safeties',1)">+</button></div></div>
                <div class="stat-row"><label>8B</label><div class="innings-wrapper"><button onclick="changeStat('pB_b8',-1)">−</button><input id="pB_b8" type="number" value="0" readonly><button onclick="changeStat('pB_b8',1)">+</button></div></div>
                <div class="stat-row"><label>B+R</label><div class="innings-wrapper"><button onclick="changeStat('pB_br',-1)">−</button><input id="pB_br" type="number" value="0" readonly><button onclick="changeStat('pB_br',1)">+</button></div></div>
                <div class="stat-row"><label>E8</label><div class="innings-wrapper"><button onclick="changeStat('pB_e8',-1)">−</button><input id="pB_e8" type="number" value="0" readonly><button onclick="changeStat('pB_e8',1)">+</button></div></div>
                <div class="stat-row" onclick="secretHandshake()" style="user-select: none;"><label>Coach</label><input type="checkbox" id="pB_coach" onchange="saveNow()"></div>
            </div>
        </div>

        <div style="text-align:center; padding-top:20px;">
            <button id="submitMatch" style="display:none; background-color:#00FF00; width:200px; height:85px; border-radius:6px; padding:6px; color:#000; font-weight:bold; font-size:20px;">Submit Match</button> 
        </div>

        <div id="inningsContainer" style="text-align:center; margin-top:10px;">
            <label>Innings</label><br>
            <div class="innings-wrapper">
                <button type="button" class="btn-minus" onclick="changeStat('matchInnings', -1)">−</button>
                <input type="number" id="matchInnings" style="margin-top:4px;" value="0" min="0" readonly>
                <button type="button" class="btn-plus" onclick="changeStat('matchInnings', 1)">+</button>
            </div>
        </div>

        <div style="display: none;"><input id="matchWinner" readonly></div>

        <div style="margin-top:20px; border-radius:8px;">
            <div id="teamScoreDisplay" style="text-align:center; font-size:28px; font-weight:bold; margin-bottom:10px; color:#1e90ff;">Match Score: <span id="homeScore">0</span> - <span id="awayScore">0</span></div>
            <div class="button-row">
                <button type="button" onclick="exportScoresheet()">Transfer</button>
                <button type="button" onclick="toggleNotes()">Notes</button>
                <button type="button" class="startBtn" onclick="startTimer()">Timer</button>
                <button type="button" onclick="showHistory()">Scores</button>
                <button type="button" onclick="resetLagFields()">Reset Match</button>
            </div>    
        </div>
    </div>

    <div id="timerBox">
        <span id="timerValue">0</span> sec
        <button class="closeBtn" onclick="closeTimer()">X</button>
    </div>

    <div id="notesContainer" style="display:none; text-align:center; margin-top:12px; border: 2px solid #1e90ff;">
        <textarea id="matchNotes" style="width:95%; max-width:500px; height:80px; font-size:16px; padding:10px;" oninput="saveNow()">-</textarea>
    </div>

    <button id="addPlayerBtn" class="uiButton" type="button" onclick="addNewPlayerManual()">Add a Player to Either Roster</button>
  <a href="index.html" class="back-button">Main Menu</a>
</div>



<div id="admin-panel" style="display:none; padding:15px; background:#111; border:1px solid gold; border-radius:8px; margin:20px 10px;">
    <div style="color:gold; font-weight:bold; margin-bottom:10px; font-size:14px;">LEAGUE MANAGER CONSOLE</div>
    <input type="text" id="adminTickerInput" placeholder="Enter announcement..." style="width:100%; padding:12px; margin-bottom:10px; border-radius:4px; border:1px solid #555; background:#222; color:#fff; box-sizing:border-box;">
    <div style="display:flex; gap:10px;">
        <button onclick="postAdminTicker()" style="flex:1; padding:12px; background:#c00; color:#fff; font-weight:bold; border:none; border-radius:4px;">POST</button>
        <button onclick="clearTicker()" style="flex:1; padding:12px; background:#444; color:#fff; border:none; border-radius:4px;">CLEAR</button>
    </div>
</div>

<script>
let isLoading = false;
const FORM_KEY = "scoresheetData";
let scores = JSON.parse(localStorage.getItem("teamMatchScores")) || { home: 0, away: 0 };
let pendingPlayerData = null; 
let targetScores = {}; 
let announcedFeats = JSON.parse(localStorage.getItem("announcedFeats")) || [];
let tickerQueue = [];
let isTickerRunning = false;
let adminClicks = 0;
let adminTimer;
let timerInterval, seconds = 0;

const API_BROADCAST = "https://script.google.com/macros/s/AKfycbygPYKH-JPSOpIQktnflwvHTRZR4o8WNI20Dz5bWsNw3aVbCHz2lPgQHRPBMBsQ9dkpVA/exec";
const API_SCRATCH = "https://script.google.com/macros/s/AKfycbyRjXuYcYphBNsoYk5rD1h8PP1Ae4uph5Z-FsR5XQzLvhNXXtsu-HMOnSUCcltgnB8q/exec";
const API_SUBMIT = "https://script.google.com/macros/s/AKfycbyeGT6H-64w_m4IBkkZfFnRAzmA0NM3PnJQNqFHuiUQwqk2-Y-H7-ernNKKqC95NyXH/exec";
const CSV_SHEET = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS_k0GqoHgGfyxHgIX-8tjbspkJ_ncZBSRCEdqf7lrfCYRFQVH3GUwxvqYGETT-ST0jswQ94V4DXsaH/pub?output=csv";

// --- INITIALIZATION & BRIDGE ---
(function() {
    const params = new URLSearchParams(window.location.search);
    if (params.has("data")) {
        const decodedData = JSON.parse(decodeURIComponent(params.get("data")));
        if (decodedData.hdata) {
            localStorage.setItem("matchHistory", JSON.stringify(decodedData.hdata));
            delete decodedData.hdata;
        }
        localStorage.setItem(FORM_KEY, JSON.stringify(decodedData));
        window.history.replaceState({}, document.title, window.location.pathname);
    }
})();

window.addEventListener("DOMContentLoaded", () => {
    establishSeasonBaseline();
    const lastActivity = localStorage.getItem("lastSessionActivity");
    if (lastActivity && (Date.now() - parseInt(lastActivity)) > (12 * 60 * 60 * 1000)) {
        localStorage.removeItem("matchHistory");
        localStorage.removeItem("manual_roster_additions");
        localStorage.removeItem("teamMatchScores");
        localStorage.removeItem(FORM_KEY);
        scores = { home: 0, away: 0 };
    }
    localStorage.setItem("lastSessionActivity", Date.now().toString());
    
    loadScoresheet();
    updateScoreUI();
    
    if (typeof scheduleData !== 'undefined') {
        const activeWeek = getActiveWeek();
        document.getElementById("weekDisplay").textContent = "-Week " + activeWeek.week + "-";
        document.getElementById("dateDisplay").textContent = " " + activeWeek.date;
    }

    setTimeout(checkInitialSelection, 250);
    setTimeout(checkForFeats, 3000);
    setInterval(checkForFeats, 60000);
    setInterval(syncLeagueBroadcast, 60000);
    setTimeout(syncLeagueBroadcast, 2000);
});

function getActiveWeek() {
    if (typeof scheduleData === 'undefined') return { week: 1, date: "" };
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - 2);
    return scheduleData.find(row => row.date && new Date(row.date) >= cutoff) || scheduleData[scheduleData.length - 1];
}

function establishSeasonBaseline() {
    if (typeof playerData === 'undefined' || !playerData.length) return;
    const lowIsBetter = ["Life Hash", "White Washed"];
    const ignoreKeys = ["Player #", "Player Name", "Handicap", "HC", "Matches Played"];
    Object.keys(playerData[0]).filter(k => !ignoreKeys.includes(k)).forEach(cat => {
        const scoresArr = playerData.map(p => parseFloat(String(p[cat]).replace('%', '')) || 0);
        targetScores[cat] = lowIsBetter.includes(cat) ? Math.min(...scoresArr) : Math.max(...scoresArr);
    });
}

// --- MODAL ENGINE ---
function showMasterModal(title, bodyHtml, buttons = []) {
    const modalDiv = document.getElementById("masterModal");
    if (!modalDiv) return;
    modalDiv.innerHTML = `
        <div class="modal-container">
            <h3 style="color:#1e90ff; margin-top:0; text-align:center;">${title}</h3>
            <div id="modalContent">${bodyHtml}</div>
            <div id="modalFooter">
                ${buttons.map(btn => `<button onclick="${btn.action}" style="background:${btn.color || '#444'}; color:#fff;">${btn.text}</button>`).join('')}
                <button onclick="closeMasterModal()" style="background:#222; color:#fff; border:1px solid #444;">Close</button>
            </div>
        </div>
    `;
    modalDiv.style.display = "flex";
}

function closeMasterModal() {
    const modalDiv = document.getElementById("masterModal");
    if (modalDiv) {
        modalDiv.style.display = "none";
        modalDiv.style.alignItems = "center";
        modalDiv.style.paddingTop = "10px";
    }
    pendingPlayerData = null;
}

window.onclick = (e) => { if (e.target.id === "masterModal") closeMasterModal(); };

// --- ROSTER & SELECTION ---
function updateRoster(sel, div) {
    if (!sel.value) { div.innerHTML = ""; return; }
    div.innerHTML = (scoresheetinfo[sel.value] || []).map(p => {
        const hc = scoresheetrosters[p] || 3;
        return `<div class="playerName" data-p="${p}" data-hc="${hc}"><span class="name">${p}</span><span class="hc">${hc}</span></div>`;
    }).join("");
}

["team", "opponent"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener("change", function() {
        updateRoster(this, document.getElementById(id === "team" ? "teamRoster" : "opponentRoster"));
        saveNow();
    });
});

document.addEventListener("click", e => {
    if (document.getElementById("gamePlayArea").style.display === "block") return;
    const playerDiv = e.target.closest(".playerName");
    if (!playerDiv) return;

    const name = playerDiv.getAttribute("data-p");
    const hc = playerDiv.getAttribute("data-hc");
    pendingPlayerData = { name, hc };
    const resetBtn = { text: "Reset Lag", action: "resetLagFields()", color: "crimson" };

    if (document.getElementById("lagWinnerHeader").textContent === "Lag Winner") {
        showMasterModal("Confirm Lag Winner", `<p style="text-align:center; font-size:18px;">Did <strong>${name}</strong> win the lag?</p>`, [{ text: "YES, WINNER", action: "confirmLag(true)", color: "#1e90ff" }, resetBtn]);
    } else {
        if (name === document.getElementById("lagWinner").value) return;
        showMasterModal("Confirm Lag Loser", `<p style="text-align:center; font-size:18px;">Set <strong>${name}</strong> as Lag Loser and begin match?</p>`, [{ text: "YES, START MATCH", action: "confirmLag(false)", color: "#1e90ff" }, resetBtn]);
    }
});

function checkInitialSelection() {
    if (document.getElementById("gamePlayArea").style.display === "block") return;
    const teamEl = document.getElementById("team");
    if (teamEl && (teamEl.value === "Select Home Team" || teamEl.value === "")) {
        localStorage.removeItem("announcedFeats");
        announcedFeats = [];
        let teamButtonsHtml = '<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:15px;">';
        for (let i = 1; i < teamEl.options.length; i++) {
            const teamText = teamEl.options[i].text;
            teamButtonsHtml += `<button onclick="setScoringTeam('${teamText.split(" ")[0]}')" style="background:#1e90ff; color:#fff; border:none; padding:12px 5px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:14px;">${teamText}</button>`;
        }
        teamButtonsHtml += '</div>';
        showMasterModal("Select Your Team", `<div style='text-align:center; margin-bottom:10px;'>Opponent and Rosters will fill automatically.</div>${teamButtonsHtml}`, []);
    }
}

function confirmLag(isWinner) {
    if (!pendingPlayerData) return;
    const { name, hc } = pendingPlayerData;
    if (isWinner) {
        document.getElementById("lagWinner").value = name;
        document.getElementById("pA_hc").value = hc;
        const header = document.getElementById("lagWinnerHeader");
        header.textContent = name;
        header.classList.add("active");
        document.getElementById("statusText").textContent = "Tap a Player to Set Lag Loser and Begin Match";
    } else {
        document.getElementById("lagLoser").value = name;
        document.getElementById("pB_hc").value = hc;
        const header = document.getElementById("lagLoserHeader");
        header.textContent = name;
        header.classList.add("active");
        document.getElementById("matchInnings").value = 0;
        
        ["team", "opponent", "weekDisplay", "dateDisplay", "teamRoster", "opponentRoster", "addPlayerBtn", "statusText"].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.style.display = "none";
        });
        document.getElementById("gamePlayArea").style.display = "block";
    }
    closeMasterModal();
    updateMatchWinner();
    saveNow();
}

function getTeamNameByNumber(num) {
    const options = document.getElementById("team").options;
    for (let i = 0; i < options.length; i++) {
        if (options[i].text.startsWith(num + " ")) return options[i].text;
    }
    return null;
}

function resetLagFields() {
    ["lagWinner", "lagLoser", "matchWinner"].forEach(id => document.getElementById(id).value = "");
    document.getElementById("matchInnings").value = 0;
    document.querySelectorAll('[id^="pA_"], [id^="pB_"]').forEach(el => {
        if (el.type === "checkbox") el.checked = false;
        else el.value = 0;
    });

    ["lagWinnerHeader", "lagLoserHeader"].forEach(id => {
        const h = document.getElementById(id);
        h.textContent = id.includes("Winner") ? "Lag Winner" : "Lag Loser";
        h.classList.remove("active");
        h.style.visibility = "hidden";
    });

    document.getElementById("gamePlayArea").style.display = "none";
    ["team", "opponent", "weekDisplay", "dateDisplay", "teamRoster", "opponentRoster", "addPlayerBtn", "statusText"].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = "block";
    });
    document.getElementById("statusText").textContent = "Tap a Player to Set Lag Winner";
    closeMasterModal();
    saveNow();
}

function updateScoreUI() {
    document.getElementById("homeScore").textContent = scores.home;
    document.getElementById("awayScore").textContent = scores.away;
}

function changeStat(id, amount) {
    const el = document.getElementById(id);
    if (!el) return;
    el.value = Math.max(0, (parseInt(el.value) || 0) + amount);    
    if (['pA_wins', 'pB_wins', 'pA_hc', 'pB_hc'].includes(id)) {
        document.getElementById('pA_coach').checked = false;
        document.getElementById('pB_coach').checked = false;
        updateMatchWinner();
    }
    saveNow();
}

function updateMatchWinner() {
    const aWins = parseInt(document.getElementById("pA_wins").value) || 0;
    const bWins = parseInt(document.getElementById("pB_wins").value) || 0;
    const aHC = parseInt(document.getElementById("pA_hc").value) || 0;
    const bHC = parseInt(document.getElementById("pB_hc").value) || 0;
    const winField = document.getElementById("matchWinner");
    const subBtn = document.getElementById("submitMatch");

    let winnerName = "";
    if (aWins === aHC && aHC > 0) winnerName = document.getElementById("lagWinner").value;
    else if (bWins === bHC && bHC > 0) winnerName = document.getElementById("lagLoser").value;

    winField.value = winnerName;
    if (winnerName) {
        subBtn.textContent = `Winner: ${winnerName} - Submit Match`;
        subBtn.style.display = "inline-block";
    } else {
        subBtn.textContent = "Submit Match";
        subBtn.style.display = "none";
    }
}

function showHistory() {
    const history = JSON.parse(localStorage.getItem("matchHistory")) || [];
    let tableHtml = '<table style="width:100%; border-collapse:collapse; color:#fff; font-size:14px;"><thead><tr style="border-bottom:2px solid #444;"><th style="padding:8px; text-align:left;">Match</th><th style="padding:8px; text-align:center;">Result</th><th style="padding:8px; text-align:center;">Inn.</th></tr></thead><tbody>';
    if (history.length === 0) {
        tableHtml += '<tr><td colspan="3" style="text-align:center; padding:20px;">No matches yet.</td></tr>';
    } else {
        tableHtml += history.map((m, i) => `<tr style="border-bottom:1px solid #333;"><td style="padding:8px;"><div style="font-weight:bold; color:#1e90ff;">M${i + 1}</div><small>${m.lagWinner} vs ${m.lagLoser}</small></td><td style="padding:8px; text-align:center;">${m.pA.wins}-${m.pB.wins}<br><small style="color:#0f0;">${m.matchWinner}</small></td><td style="padding:8px; text-align:center;">${m.matchInnings}</td></tr>`).join("");
    }
    tableHtml += '</tbody></table>';
    showMasterModal("Match History", tableHtml, [{ text: "Current League Scores", color: "#1e90ff", action: "closeMasterModal(); showScoreBoard();" }]);
}

function saveNow() {
    if (isLoading) return;
    const data = {};
    document.querySelectorAll("input[id], select[id], textarea[id]").forEach(el => {
        data[el.id] = el.type === "checkbox" ? el.checked : el.value;
    });
    data.mScores = scores;
    data.scoringTeam = localStorage.getItem("scoringTeamName") || "Unknown";
    data.gameVisible = document.getElementById("gamePlayArea").style.display === "block";
    data.lwH = document.getElementById("lagWinnerHeader").textContent;
    data.llH = document.getElementById("lagLoserHeader").textContent;
    localStorage.setItem(FORM_KEY, JSON.stringify(data));
}

function loadScoresheet() {
    const raw = localStorage.getItem(FORM_KEY);
    if (!raw) return;
    try {
        const data = JSON.parse(raw);
        isLoading = true;
        Object.keys(data).forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                if (el.type === "checkbox") el.checked = data[id] === true;
                else el.value = data[id];
            }
        });

        const lw = document.getElementById("lagWinner").value;
        const ll = document.getElementById("lagLoser").value;
        if (lw) { const h = document.getElementById("lagWinnerHeader"); h.textContent = lw; h.style.visibility = "visible"; h.classList.add("active"); }
        if (ll) { const h = document.getElementById("lagLoserHeader"); h.textContent = ll; h.style.visibility = "visible"; h.classList.add("active"); }

        if (data.gameVisible) {
            document.getElementById("gamePlayArea").style.display = "block";
            ["team", "opponent", "weekDisplay", "dateDisplay", "teamRoster", "opponentRoster", "addPlayerBtn", "statusText"].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.style.display = "none";
            });
        }
        if (data.mScores) scores = data.mScores;
        updateRoster(document.getElementById("team"), document.getElementById("teamRoster"));
        updateRoster(document.getElementById("opponent"), document.getElementById("opponentRoster"));
        updateScoreUI();
        isLoading = false;
    } catch (e) {
        console.error("Load failed:", e);
    }
}

// --- SUBMISSION & TICKER ---
document.getElementById("submitMatch").onclick = async function() {
    const btn = this;
    const loader = document.getElementById("loadingOverlay");
    btn.disabled = true;
    loader.style.display = "flex";

    const data = {
        scoringTeam: localStorage.getItem("scoringTeamName") || "Unknown",
        team: document.getElementById("team").value,
        opponent: document.getElementById("opponent").value,
        lagWinner: document.getElementById("lagWinner").value,
        lagLoser: document.getElementById("lagLoser").value,
        matchInnings: document.getElementById("matchInnings").value,
        pA: { handicap: document.getElementById("pA_hc").value, wins: document.getElementById("pA_wins").value, safeties: document.getElementById("pA_safeties").value, b8: document.getElementById("pA_b8").value, br: document.getElementById("pA_br").value, e8: document.getElementById("pA_e8").value },
        pB: { handicap: document.getElementById("pB_hc").value, wins: document.getElementById("pB_wins").value, safeties: document.getElementById("pB_safeties").value, b8: document.getElementById("pB_b8").value, br: document.getElementById("pB_br").value, e8: document.getElementById("pB_e8").value },
        matchWinner: document.getElementById("matchWinner").value,
        matchNotes: document.getElementById("matchNotes").value,
        announcement: ""
    };

    const statMap = [{ idKey: "b8", fileKey: "8 on Break" }, { idKey: "br", fileKey: "Break and Run" }, { idKey: "mini", fileKey: "Mini-Slam" }, { idKey: "rack", fileKey: "Rackless" }, { idKey: "und", fileKey: "Undefeated" }];
    let newLeadsFound = [];

    [{ name: data.lagWinner, stats: data.pA, opponentWins: data.pB.wins }, { name: data.lagLoser, stats: data.pB, opponentWins: data.pA.wins }].forEach(player => {
        const record = playerData.find(p => p["Player Name"] === player.name);
        if (!record) return;

        if (data.matchWinner === player.name) {
            record["Current Win Streak"] = (parseInt(record["Current Win Streak"]) || 0) + 1;
            if (record["Current Win Streak"] >= 5) newLeadsFound.push(`🔥 ${player.name.toUpperCase()} Win Streak Increased to ${record["Current Win Streak"]} 🔥`);
            if (record["Current Win Streak"] > (parseInt(record["Longest Win Streak"]) || 0)) record["Longest Win Streak"] = record["Current Win Streak"];
        } else {
            record["Current Win Streak"] = 0;
        }

        statMap.forEach(stat => {
            let addedValue = 0;
            if (["b8", "br"].includes(stat.idKey)) addedValue = parseInt(player.stats[stat.idKey]) || 0;
            if (stat.idKey === "mini" && (parseInt(player.stats.b8) || 0) > 0 && (parseInt(player.stats.br) || 0) > 0) addedValue = 1;
            if (["rack", "und"].includes(stat.idKey) && (parseInt(player.stats.wins) || 0) > 0 && parseInt(player.opponentWins) === 0) addedValue = 1;
            if (addedValue <= 0) return;

            const barToBeat = targetScores[stat.fileKey] || 0;
            const playerOldScore = parseFloat(String(record[stat.fileKey]).replace('%', '')) || 0;
            const newTotal = playerOldScore + addedValue;
            const blastKey = `blast_${player.name}_${stat.idKey}_${newTotal}`;

            if (newTotal > barToBeat && playerOldScore < barToBeat && !localStorage.getItem(blastKey)) {
                newLeadsFound.push(`${player.name} takes the lead in ${stat.fileKey} with ${newTotal}`);
                localStorage.setItem(blastKey, "true");
                targetScores[stat.fileKey] = newTotal;
            }
        });
    });

    if (newLeadsFound.length > 0) {
        const containsLeader = newLeadsFound.some(msg => msg.includes("takes the lead"));
        const msg = containsLeader ? `*** 🏆 NEW LIFETIME LEAGUE LEADER: ${newLeadsFound.join(" | ")} ***` : newLeadsFound.join(" | ");
        
        const scratchData = [{ name: data.lagWinner, wins: parseInt(data.pA.wins), isWinner: (data.matchWinner === data.lagWinner) }, { name: data.lagLoser, wins: parseInt(data.pB.wins), isWinner: (data.matchWinner === data.lagLoser) }].map(p => ({
            name: p.name, count: 5 + (p.wins > 0 ? 1 : 0) + (p.isWinner ? 1 : 0)
        }));

        fetch(API_SCRATCH, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "ALLOWANCE_UPDATE", players: scratchData }) });
        fetch(API_BROADCAST, { method: "POST", mode: "no-cors", body: JSON.stringify({ announcement: msg }) });
    }

    fetch(API_SUBMIT, { method: "POST", mode: "no-cors", body: JSON.stringify(data) }).then(() => {
        loader.style.display = "none";
        const history = JSON.parse(localStorage.getItem("matchHistory")) || [];
        history.push(data);
        localStorage.setItem("matchHistory", JSON.stringify(history));

        const winnerName = document.getElementById("matchWinner").value;
        const homeTeamName = document.getElementById("team").value;
        if (winnerName && homeTeamName) {
            if ((scoresheetinfo[homeTeamName] || []).includes(winnerName)) scores.home++;
            else scores.away++;
        }

        localStorage.setItem("teamMatchScores", JSON.stringify(scores));
        updateScoreUI();

        document.getElementById("gamePlayArea").style.display = "none";
        ["team", "opponent", "weekDisplay", "dateDisplay", "teamRoster", "opponentRoster", "addPlayerBtn", "statusText"].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.style.display = "block";
        });

        document.querySelectorAll('[id^="pA_"], [id^="pB_"]').forEach(el => {
            if (el.type === "number") el.value = 0;
            if (el.type === "checkbox") el.checked = false;
        });
        resetLagFields();
        document.getElementById("matchNotes").value = "-";

        if ((scores.home + scores.away) >= 5) {
            showMasterModal("Match Night Complete", `<div style="text-align:center; font-size:22px; padding:20px;"><span style="color:gold; font-weight:bold;">${document.getElementById("team").value} vs ${document.getElementById("opponent").value} Completed</span></div>`, []);
            scores = { home: 0, away: 0 };
            localStorage.setItem("teamMatchScores", JSON.stringify(scores));
            updateScoreUI();
        }
        btn.disabled = false;
        saveNow();
    });
};

function findMatchup(teamNumber) {
    if (typeof scheduleData === 'undefined') return null;
    const activeWeek = getActiveWeek();
    for (let i = 1; i <= 5; i++) {
        const match = activeWeek["m" + i];
        if (!match) continue;
        const teams = match.split('(')[0].split('v');
        if (teams[0].trim() == teamNumber || teams[1].trim() == teamNumber) return { home: teams[0].trim(), away: teams[1].trim() };
    }
    return null;
}

function setScoringTeam(myNum) {
    const matchup = findMatchup(myNum);
    if (!matchup) return;
    const homeName = getTeamNameByNumber(Number(matchup.home));
    const awayName = getTeamNameByNumber(Number(matchup.away));
    if (homeName && awayName) {
        document.getElementById("team").value = homeName;
        document.getElementById("opponent").value = awayName;
        localStorage.setItem("scoringTeamName", getTeamNameByNumber(Number(myNum)));
        document.getElementById("team").dispatchEvent(new Event('change'));
        document.getElementById("opponent").dispatchEvent(new Event('change'));
        closeMasterModal();
        saveNow();
    }
}

function addNewPlayerManual() {
    const homeName = document.getElementById("team").value || "Home Team";
    const awayName = document.getElementById("opponent").value || "Away Team";
    const bodyHtml = `<div style="margin-top:20px; width:100%;"><input type="text" id="manualPlayerName" placeholder="Enter Player Name" style="width:100%; padding:12px; font-size:18px; margin-bottom:20px; border-radius:6px; border:1px solid #444; background:#111; color:#fff; box-sizing:border-box;"><div style="display:flex; flex-direction:column; gap:15px; padding-left:10px;"><label><input type="radio" name="npTeam" value="home" checked style="transform:scale(1.3); margin-right:10px;"> ${homeName}</label><label><input type="radio" name="npTeam" value="away" style="transform:scale(1.3); margin-right:10px;"> ${awayName}</label></div></div>`;
    showMasterModal("Add to Roster", bodyHtml, [{ text: "Add to Roster", action: "confirmNewPlayer()", color: "#1e90ff" }]);
    setTimeout(() => { const inp = document.getElementById("manualPlayerName"); if (inp) inp.focus(); }, 100);
}

function confirmNewPlayer() {
    const nameInput = document.getElementById("manualPlayerName");
    const newName = nameInput ? nameInput.value.trim() : "";
    if (!newName) return;
    const side = document.querySelector('input[name="npTeam"]:checked').value;
    const teamDropdown = document.getElementById(side === 'home' ? "team" : "opponent");
    const teamName = teamDropdown.value;
    if (!scoresheetinfo[teamName]) scoresheetinfo[teamName] = [];
    if (!scoresheetinfo[teamName].some(p => p.toLowerCase() === newName.toLowerCase())) {
        scoresheetinfo[teamName].push(newName);
        localStorage.setItem("manual_roster_additions", JSON.stringify(scoresheetinfo));
        updateRoster(teamDropdown, document.getElementById(side === 'home' ? "teamRoster" : "opponentRoster"));
    }
    saveNow();
    closeMasterModal();
}

function exportScoresheet() {
    const rawData = localStorage.getItem(FORM_KEY);
    if (!rawData) return alert("No data to transfer.");

function startTimer() {
    seconds = 0;
    document.getElementById("timerValue").textContent = "0";
    document.getElementById("timerBox").style.display = "block";
    clearInterval(timerInterval);
    timerInterval = setInterval(() => { seconds++; document.getElementById("timerValue").textContent = seconds; }, 1000);
}

    clearInterval(timerInterval); 
    document.getElementById("timerBox").style.display = "none"; 
}

function showTicker(msg) {
    tickerQueue.push(msg);
    if (!isTickerRunning) processNextMessage();
}

function processNextMessage() {
    const container = document.getElementById('ticker-container');
    const textEl = document.getElementById('ticker-text');
    if (tickerQueue.length === 0) {
        isTickerRunning = false;
        if (container) container.style.display = 'none';
        return;
    }
    isTickerRunning = true;
    const currentMsg = tickerQueue.shift();
    if (container && textEl) {
        textEl.textContent = currentMsg;
        container.style.display = 'block';
        setTimeout(() => {
            container.style.display = 'none';
            setTimeout(processNextMessage, 1000);
        }, 25000);
    }
}

function clearTicker() {
    document.getElementById('ticker-container').style.display = 'none';
}

async function checkForFeats() {
    const todayStr = new Date().toLocaleDateString();
    try {
        const response = await fetch(CSV_SHEET + "&cachebust=" + Date.now());
        const rows = (await response.text()).split(/\r?\n/).filter(r => r.trim() !== "").slice(1);
        let newFeatsFound = [];

        rows.forEach(row => {
            const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            if (!cols[0] || !cols[0].trim().startsWith(todayStr)) return;
            const pAName = cols[3]?.replace(/"/g, "").trim();
            if (!pAName) return;

            const check = (name, type, val) => {
                if (parseInt(val) > 0 && !announcedFeats.includes(`${name}-${type}`)) {
                    newFeatsFound.push(`${name} ${type}!`);
                    announcedFeats.push(`${name}-${type}`);
                }
            };

            check(pAName, "8-on-Break", cols[9]);
            check(pAName, "Break & Run", cols[10]);
            if (parseInt(cols[9]) > 0 && parseInt(cols[10]) > 0) check(pAName, "Mini-Slam", 1);
            if (parseInt(cols[13]) === 0) check(pAName, "Rackless/Undefeated", 1);

            if (cols.length >= 17) {
                const pBName = cols[4]?.replace(/"/g, "").trim();
                if (pBName) {
                    check(pBName, "8-on-Break", cols[15]);
                    check(pBName, "Break & Run", cols[16]);
                    if (parseInt(cols[15]) > 0 && parseInt(cols[16]) > 0) check(pBName, "Mini-Slam", 1);
                    if (parseInt(cols[7]) === 0) check(pBName, "Undefeated", 1);
                }
            }
        });

        if (newFeatsFound.length > 0) {
            showTicker("*** Congratulations " + newFeatsFound.join(" - ") + " ***");
            localStorage.setItem("announcedFeats", JSON.stringify(announcedFeats));
        }
    } catch (err) { console.warn("Ticker skip:", err); }
}

async function showScoreBoard() {
    const board = document.getElementById('score-board');
    const todayStr = new Date().toLocaleDateString();
    board.innerHTML = '<h3 style="color:gold;">FETCHING LIVE SCORES...</h3>';
    board.style.display = 'block';

    try {
        const response = await fetch(CSV_SHEET + "&cachebust=" + Date.now());
        const rows = (await response.text()).split(/\r?\n/).filter(r => r.trim() !== "").slice(1);
        let teamWins = {};
        let uniqueMatches = new Map();
        Object.keys(scoresheetinfo).forEach(t => teamWins[t] = 0);

        rows.forEach(row => {
            const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            if (cols[0] && cols[0].trim().startsWith(todayStr)) {
                const pA = cols[3]?.replace(/"/g, "").trim();
                const pB = cols[4]?.replace(/"/g, "").trim();
                if (pA && pB) {
                    const matchID = [pA, pB].sort().join("|");
                    if (!uniqueMatches.has(matchID) || cols[18]) uniqueMatches.set(matchID, cols);
                }
            }
        });

        let matchDetails = '<h4 style="color:gold; margin-top:20px;">INDIVIDUAL MATCHES</h4>';
        uniqueMatches.forEach(cols => {
            const pA = cols[3]?.replace(/"/g, "").trim();
            const pB = cols[4]?.replace(/"/g, "").trim();
            const winner = cols[18]?.replace(/"/g, "").trim();
            if (winner) {
                for (const [team, players] of Object.entries(scoresheetinfo)) {
                    if (players.includes(winner)) { teamWins[team]++; break; }
                }
            }
            matchDetails += `<div class="score-row">${pA} ${cols[7] || 0} - ${cols[13] || 0} ${pB}</div>`;
        });

        let teamHTML = '<h3>TONIGHT\'S STANDINGS</h3><table class="team-table"><tr><th style="text-align:left;">Team Name</th><th>Wins</th></tr>';
        Object.entries(teamWins).sort((a, b) => b[1] - a[1]).forEach(([team, wins]) => {
            if (wins > 0) teamHTML += `<tr><td style="text-align:left;">${team}</td><td><strong>${wins}</strong></td></tr>`;
        });
        teamHTML += '</table>';

        board.innerHTML = uniqueMatches.size === 0 ? '<h3>No matches recorded today.</h3><div class="score-close" onclick="this.parentElement.style.display=\'none\'">[ CLOSE ]</div>' : teamHTML + matchDetails + '<div class="score-close" onclick="this.parentElement.style.display=\'none\'">[ CLOSE ]</div>';
    } catch (e) { board.innerHTML = '<h3 style="color:red;">Error loading scores.</h3>'; }
}

function secretHandshake() {

    clearTimeout(adminTimer);

        const panel = document.getElementById('admin-panel');

    fetch(API_BROADCAST, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "setAnnouncement", message: `*** League Announcement *** ${msg} .` }) }).then(() => {

        input.value = "";

}

async function syncLeagueBroadcast() {
    try {
        const response = await fetch(API_BROADCAST);
        const text = (await response.text()).trim();
        if (text.startsWith("<!DOCTYPE html>") || text.includes("<html")) return;
        const lastSeen = localStorage.getItem('lastSeenBroadcast');
        if (text && text !== "-" && text !== lastSeen) {
            showTicker(text);
            localStorage.setItem('lastSeenBroadcast', text);
        }
    } catch (e) { console.warn("Broadcast sync failed"); }
}
