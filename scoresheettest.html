<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROPL Scratch-Off</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; overflow: hidden; }
        h1 { color: #1e90ff; text-transform: uppercase; letter-spacing: 2px; }
        #scratch-container { position: relative; width: 320px; height: 160px; margin: 40px auto; visibility: hidden; }
        .prize-area { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #111; display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 12px; border: 2px solid #333; z-index: 1; }
        .prize-text { font-size: 1.8rem; font-weight: bold; color: #ffd700; font-family: monospace; }
        #scratch-canvas { position: absolute; top: 0; left: 0; z-index: 2; touch-action: none; border-radius: 12px; cursor: crosshair; }
        .status { margin-top: 20px; color: #666; font-size: 0.9rem; }
        .loading { margin-top: 100px; font-family: monospace; color: #1e90ff; }
    </style>
</head>
<body>

    <div id="loading-screen" class="loading">COMMUNICATING WITH SERVER...</div>

    <div id="main-content" style="display:none;">
        <h1>🎰 ROPL SCRATCHER</h1>
        <div id="scratch-container">
            <div class="prize-area">
                <div id="prize-name" class="prize-text">LOADING...</div>
            </div>
            <canvas id="scratch-canvas" width="320" height="160"></canvas>
        </div>
        <p id="instruction" class="status">Scratch to reveal your daily result</p>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/YOUR_DEPLOYED_ID/exec";
        const canvas = document.getElementById('scratch-canvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let isRevealed = false;

        async function initScratcher() {
            try {
                // 1. Fetch the result from Google first
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                document.getElementById('prize-name').innerText = data.prize;

                // 2. Setup Canvas
                ctx.fillStyle = '#777';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Add texture
                ctx.fillStyle = '#444';
                for(let i=0; i<100; i++) {
                    ctx.fillRect(Math.random()*canvas.width, Math.random()*canvas.height, 2, 2);
                }
                
                ctx.fillStyle = '#eee';
                ctx.font = 'bold 20px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('SCRATCH HERE', canvas.width/2, canvas.height/2 + 7);

                // 3. Reveal UI
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                document.getElementById('scratch-container').style.visibility = 'visible';

            } catch (err) {
                document.getElementById('loading-screen').innerText = "CONNECTION ERROR. TRY AGAIN.";
            }
        }

        function scratch(e) {
            if (!isDrawing || isRevealed) return;

            const rect = canvas.getBoundingClientRect();
            const x = (e.pageX || e.touches[0].pageX) - rect.left;
            const y = (e.pageY || e.touches[0].pageY) - rect.top;

            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 25, 0, Math.PI * 2);
            ctx.fill();

            handlePercentage();
        }

        function handlePercentage() {
            const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            let count = 0;
            for (let i = 3; i < pixels.length; i += 4) { if (pixels[i] === 0) count++; }
            
            if ((count / (pixels.length / 4)) > 0.6) {
                isRevealed = true;
                canvas.style.transition = 'opacity 0.6s';
                canvas.style.opacity = '0';
                document.getElementById('instruction').innerText = "SHOW THIS TO THE BARTENDER";
            }
        }

        canvas.addEventListener('mousedown', () => isDrawing = true);
        canvas.addEventListener('touchstart', () => isDrawing = true);
        window.addEventListener('mouseup', () => isDrawing = false);
        window.addEventListener('touchend', () => isDrawing = false);
        canvas.addEventListener('mousemove', scratch);
        canvas.addEventListener('touchmove', e => { e.preventDefault(); scratch(e); });

        initScratcher();
    </script>
</body>
</html>
