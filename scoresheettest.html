<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROPL 8-Ball Hunt</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 10px; user-select: none; }
        h1 { color: #1e90ff; text-transform: uppercase; letter-spacing: 2px; margin: 10px 0; }
        
        .setup-box { background: #111; border: 1px solid #333; padding: 20px; border-radius: 8px; max-width: 350px; margin: 20px auto; }
        select { width: 100%; padding: 12px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; font-size: 1rem; margin-bottom: 15px; }
        button { width: 100%; padding: 12px; background: #1e90ff; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }

        .stats { background: #111; border: 1px solid #333; padding: 15px; margin: 10px auto; max-width: 350px; border-radius: 8px; font-family: monospace; font-size: 1.2rem; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 350px; margin: 0 auto; }
        .cell { position: relative; aspect-ratio: 1/1; background: #111; border: 1px solid #222; border-radius: 8px; }
        .content { position: absolute; top:0; left:0; width:100%; height:100%; display: flex; align-items: center; justify-content: center; font-size: 2rem; z-index: 1; }
        canvas { position: absolute; top:0; left:0; width:100%; height:100%; z-index: 2; touch-action: none; }
        
        .win { color: #ffd700; display: none; text-shadow: 0 0 10px gold; margin-top: 20px; font-weight: bold; }
        .fail { color: #ff4500; display: none; margin-top: 20px; font-weight: bold; }
        #loading { margin-top: 50px; color: #1e90ff; font-family: monospace; }
    </style>
</head>
<body>

    <div id="loading">LOADING ROSTERS...</div>

    <div id="setup" class="setup-box" style="display:none;">
        <h3>SELECT YOUR NAME</h3>
        <select id="player-select"></select>
        <button onclick="startGame()">START GAME</button>
    </div>

    <div id="game-ui" style="display:none;">
        <h1>🎱 8-BALL HUNT</h1>
        <div class="stats">SCRATCHES LEFT: <span id="scratches" style="color:#ff4500;">7</span></div>
        <div class="grid" id="grid"></div>
        <div id="win-msg" class="win">🏆 WINNER LOGGED!<br>FOUND ALL 4 BALLS</div>
        <div id="fail-msg" class="fail">OUT OF SCRATCHES.<br>TRY AGAIN TOMORROW.</div>
    </div>

    <script src="scoresheetrosters.js"></script>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzpxMSe7EIUS4K5iz9PMswcswNO8uH_WajjA3WhAR2x74ZVO0D7rKbFUEyRInlRHHfC/exec";

        let gridData = [], revealed = Array(16).fill(false), remaining = 7, ballsFound = 0, active = true;
        let selectedPlayer = "";

        // Fill the dropdown from scoresheetrosters variable
        window.onload = () => {
            const select = document.getElementById('player-select');
            try {
                const names = Object.keys(scoresheetrosters).sort();
                names.forEach(name => {
                    let opt = document.createElement('option');
                    opt.value = name;
                    opt.textContent = name;
                    select.appendChild(opt);
                });
                document.getElementById('loading').style.display = 'none';
                document.getElementById('setup').style.display = 'block';
            } catch (e) {
                document.getElementById('loading').innerText = "ERROR: scoresheetrosters.js not found or invalid.";
            }
        };

        async function startGame() {
            selectedPlayer = document.getElementById('player-select').value;
            document.getElementById('setup').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            document.getElementById('loading').innerText = "FETCHING BOARD...";

            try {
                const r = await fetch(SCRIPT_URL);
                const d = await r.json();
                gridData = d.grid;
                buildGrid();
                document.getElementById('loading').style.display = 'none';
                document.getElementById('game-ui').style.display = 'block';
            } catch (e) {
                document.getElementById('loading').innerText = "SERVER ERROR.";
            }
        }

        function buildGrid() {
            const container = document.getElementById('grid');
            gridData.forEach((val, i) => {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.innerHTML = `<div class="content">${val ? '🎱' : '❌'}</div>`;
                const canv = document.createElement('canvas');
                cell.appendChild(canv);
                initCanvas(canv, i);
                container.appendChild(cell);
            });
        }

        function initCanvas(canv, idx) {
            const ctx = canv.getContext('2d');
            canv.width = 100; canv.height = 100;
            ctx.fillStyle = '#444'; ctx.fillRect(0,0,100,100);
            ctx.fillStyle = '#222'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center'; ctx.fillText('ROPL', 50, 55);

            const scratch = (e) => {
                if (!active || revealed[idx]) return;
                const rect = canv.getBoundingClientRect();
                const t = e.touches ? e.touches[0] : e;
                const x = ((t.pageX - rect.left) / rect.width) * 100;
                const y = ((t.pageY - rect.top) / rect.height) * 100;
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath(); ctx.arc(x, y, 18, 0, Math.PI*2); ctx.fill();

                const pix = ctx.getImageData(0,0,100,100).data;
                let hits = 0;
                for(let i=3; i<pix.length; i+=4) if(pix[i] === 0) hits++;
                if (hits > 4500) { canv.style.display = 'none'; processSelection(idx); }
            };

            canv.addEventListener('mousedown', () => canv.isDown = true);
            canv.addEventListener('touchstart', () => canv.isDown = true);
            window.addEventListener('mouseup', () => canv.isDown = false);
            window.addEventListener('touchend', () => canv.isDown = false);
            canv.addEventListener('mousemove', (e) => canv.isDown && scratch(e));
            canv.addEventListener('touchmove', (e) => { e.preventDefault(); scratch(e); });
        }

        async function logWin() {
            await fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors", 
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ playerName: selectedPlayer, result: "WINNER" })
            });
        }

        function processSelection(i) {
            if (revealed[i] || !active) return;
            revealed[i] = true;
            remaining--;
            document.getElementById('scratches').innerText = remaining;

            if (gridData[i] === 1) ballsFound++;

            if (ballsFound === 4) {
                active = false;
                document.getElementById('win-msg').style.display = 'block';
                logWin();
            } else if (remaining <= 0) {
                active = false;
                document.getElementById('fail-msg').innerHTML = `OUT OF SCRATCHES.<br>FOUND ${ballsFound} OF 4`;
                document.getElementById('fail-msg').style.display = 'block';
            }
        }
    </script>
</body>
</html>
