<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROPL 8-Ball Hunt</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 10px; user-select: none; }
        h1 { color: #1e90ff; text-transform: uppercase; letter-spacing: 2px; margin: 10px 0; }
        .setup-box { background: #111; border: 1px solid #333; padding: 20px; border-radius: 8px; max-width: 350px; margin: 20px auto; }
        select { width: 100%; padding: 12px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; font-size: 1rem; margin-bottom: 15px; }
        button { width: 100%; padding: 12px; background: #1e90ff; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .stats { background: #111; border: 1px solid #333; padding: 15px; margin: 10px auto; max-width: 350px; border-radius: 8px; font-family: monospace; font-size: 1.2rem; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 350px; margin: 0 auto; }
        .cell { position: relative; aspect-ratio: 1/1; background: #444; border: 1px solid #222; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 2rem; cursor: pointer; }
        .cell.revealed { background: #111; cursor: default; }
        .cell.hidden::after { content: 'ROPL'; position: absolute; font-size: 0.7rem; color: #222; font-weight: bold; }
        .win { color: #ffd700; display: none; text-shadow: 0 0 10px gold; margin-top: 20px; font-weight: bold; font-size: 1.5rem; }
        .fail { color: #ff4500; display: none; margin-top: 20px; font-weight: bold; font-size: 1.5rem; }
        #loading { margin-top: 50px; color: #1e90ff; font-family: monospace; }
    </style>
</head>
<body>

    <div id="loading">LOADING ROSTERS...</div>

    <div id="setup" class="setup-box" style="display:none;">
        <h3>SELECT YOUR NAME</h3>
        <select id="player-select"></select>
        <button onclick="startGame()">START GAME</button>
    </div>

    <div id="game-ui" style="display:none;">
        <h1>🎱 8-BALL HUNT</h1>
        <div class="stats">TAPS LEFT: <span id="scratches" style="color:#ff4500;">-</span></div>
        <div class="grid" id="grid"></div>
        <div id="win-msg" class="win">🏆 WINNER LOGGED!<br>FOUND 3 BALLS</div>
        <div id="fail-msg" class="fail">GAME OVER</div>
        <button id="reset-session" style="margin-top:20px; background:#333; width:auto; padding:10px;" onclick="clearSession()">FORFEIT / NEW GAME</button>
    </div>

    <script src="scoresheetrosters.js"></script>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzXZVkiE8IyzvZTW2yoaSQL846PxJ2Nuynq6G99TgTO9USZiHxYzWuOqKe18HYzE2Lm/exec";

        let gridData = [], revealed = Array(16).fill(false), remaining = 0, ballsFound = 0, active = true;
let selectedPlayer = "";

window.onload = () => {
    const select = document.getElementById('player-select');
    try {
        const names = Object.keys(scoresheetrosters).sort();
        names.forEach(name => {
            let opt = document.createElement('option');
            opt.value = name;
            opt.textContent = name;
            select.appendChild(opt);
        });

        // --- PERSISTENCE CHECK ---
        const savedPlayer = localStorage.getItem("ropl_active_player");
        const savedGrid = localStorage.getItem("ropl_active_grid");
        const savedRevealed = localStorage.getItem("ropl_active_revealed");
        const savedBalls = localStorage.getItem("ropl_active_balls");

        if (savedPlayer && savedGrid && savedRevealed) {
            selectedPlayer = savedPlayer;
            gridData = JSON.parse(savedGrid);
            revealed = JSON.parse(savedRevealed);
            ballsFound = parseInt(savedBalls) || 0;
            resumeGame();
        } else {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('setup').style.display = 'block';
        }
    } catch (e) {
        document.getElementById('loading').innerText = "ERROR: Rosters not found.";
    }
};

async function resumeGame() {
    document.getElementById('loading').innerText = "RESUMING SESSION...";
    await updateLocalAllowance(); 
    buildGrid();
    
    // Re-apply the visual "flipped" state to cells
    revealed.forEach((isRevealed, i) => {
        if (isRevealed) {
            const cell = document.getElementById(`cell-${i}`);
            cell.classList.remove('hidden');
            cell.classList.add('revealed');
            cell.innerHTML = gridData[i] === 1 ? '🎱' : '❌';
        }
    });

    document.getElementById('loading').style.display = 'none';
    document.getElementById('game-ui').style.display = 'block';
}

async function startGame() {
    selectedPlayer = document.getElementById('player-select').value;
    document.getElementById('setup').style.display = 'none';
    document.getElementById('loading').style.display = 'block';
    document.getElementById('loading').innerText = "VERIFYING ELIGIBILITY...";

    try {
        const r = await fetch(`${SCRIPT_URL}?name=${encodeURIComponent(selectedPlayer)}`);
        const d = await r.json();
        
        if (d.allowance <= 0) {
            showError("NO SCRATCHES AVAILABLE.");
            return;
        }

        gridData = d.grid;
        remaining = d.allowance;
        revealed = Array(16).fill(false);
        ballsFound = 0;

        // Initial Save
        saveState();

        document.getElementById('scratches').innerText = remaining;
        buildGrid();
        document.getElementById('loading').style.display = 'none';
        document.getElementById('game-ui').style.display = 'block';
    } catch (e) {
        document.getElementById('loading').innerText = "SERVER ERROR.";
    }
}

function saveState() {
    localStorage.setItem("ropl_active_player", selectedPlayer);
    localStorage.setItem("ropl_active_grid", JSON.stringify(gridData));
    localStorage.setItem("ropl_active_revealed", JSON.stringify(revealed));
    localStorage.setItem("ropl_active_balls", ballsFound);
}

async function updateLocalAllowance() {
    try {
        const r = await fetch(`${SCRIPT_URL}?name=${encodeURIComponent(selectedPlayer)}`);
        const d = await r.json();
        remaining = d.allowance;
        document.getElementById('scratches').innerText = remaining;
        checkState();
    } catch(e) {
        console.log("Offline mode or error fetching allowance.");
    }
}

function buildGrid() {
    const container = document.getElementById('grid');
    container.innerHTML = ""; 
    gridData.forEach((val, i) => {
        const cell = document.createElement('div');
        cell.className = 'cell hidden';
        cell.id = `cell-${i}`;
        cell.onclick = () => handleTap(i);
        container.appendChild(cell);
    });
}

async function handleTap(idx) {
    if (!active || revealed[idx] || remaining <= 0) return;
    active = false; 

    try {
        await fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify({ type: "DECREMENT_SCRATCH", playerName: selectedPlayer })
        });

        revealed[idx] = true;
        remaining--;
        if (gridData[idx] === 1) ballsFound++;

        // Save progress after every tap
        saveState();

        document.getElementById('scratches').innerText = remaining;
        const cell = document.getElementById(`cell-${idx}`);
        cell.classList.remove('hidden');
        cell.classList.add('revealed');
        cell.innerHTML = gridData[idx] === 1 ? '🎱' : '❌';

        checkState(); 
        if (remaining > 0 && ballsFound < 3) active = true;
    } catch (e) {
        alert("Connection lost. Try again.");
        active = true;
    }
}

function checkState() {
    if (ballsFound >= 3) {
        active = false;
        document.getElementById('win-msg').style.display = 'block';
        logWin();
        revealAll();
        clearSessionData();
    } else if (remaining <= 0) {
        active = false;
        document.getElementById('fail-msg').innerHTML = `GAME OVER<br>FOUND ${ballsFound} OF 3`;
        document.getElementById('fail-msg').style.display = 'block';
        revealAll();
        clearSessionData();
    }
}

function clearSessionData() {
    localStorage.removeItem("ropl_active_player");
    localStorage.removeItem("ropl_active_grid");
    localStorage.removeItem("ropl_active_revealed");
    localStorage.removeItem("ropl_active_balls");
}

function clearSession() {
    if(confirm("This will forfeit progress. Continue?")) {
        clearSessionData();
        location.reload();
    }
}

function revealAll() {
    gridData.forEach((val, i) => {
        const cell = document.getElementById(`cell-${i}`);
        if (cell && !cell.classList.contains('revealed')) {
            cell.classList.remove('hidden');
            cell.classList.add('revealed');
            cell.style.opacity = "0.4";
            cell.innerHTML = val === 1 ? '🎱' : '❌';
        }
    });
}

async function logWin() {
    await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors", 
        body: JSON.stringify({ playerName: selectedPlayer, result: "WINNER - FOUND 3" })
    });
}

function showError(msg) {
    document.getElementById('loading').innerHTML = 
        `<span style="color:#ff4500;">${msg}</span><br><br>` +
        `<button onclick="location.reload()" style="width:auto; padding:10px 20px;">BACK</button>`;
}
    </script>
</body>
</html>
