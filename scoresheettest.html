<style>
/* --- GLOBAL STYLES (Applies to Laptop & Mobile) --- */
body { 
    font-family: Arial, sans-serif; 
    font-size: 18px; 
    background-color: #000; 
    color: #fff; 
    margin: 0; 
    padding: 0; 
}

.form-wrapper {
    width: 100%;
    max-width: 550px; 
    margin: 0 auto;
    padding: 10px;
    border: 4px solid #1e90ff; /* This is your blue frame */
    box-sizing: border-box;
    min-height: 650px; 
    display: flex;
    flex-direction: column;
}

.row { display: flex; justify-content: center; gap: 5px; margin-top: 10px; font-size: 17px; }
.block { flex: 1; max-width: 50%; text-align: center; overflow-wrap: break-word; }

.roster-box {
    text-align: left;
    width: 100%;
    margin: 10px auto;
    padding: 8px 6px;
    font-size: 18px;
    white-space: pre-line;
    background-color: #000;
    color: #fff;
    font-weight: bold;
    box-sizing: border-box;
}
     #lagWinnerHeader,
#lagLoserHeader {
    font-size: 18px; visibility: hidden;
    margin-bottom: 10px;color: #FFCC33;
}
    #lagWinnerHeader.active, #lagLoserHeader.active {
    visibility: visible;
}

label { font-weight: bold; color: #fff; font-size: 20px; }
h3 { margin: 0 0 8px 0; color: #fff; }
input[type="number"] { 
    width: 35px; 
    padding: 4px 6px; 
    font-size: 20px; 
    background-color: #fff; 
    color: #000; 
    border: 1px solid #fff; 
    border-radius: 4px; 
    text-align: center;
    /* This ensures the mobile "focus" ring doesn't show up when tapped */
    outline: none; 
}

.innings-wrapper { display: flex; align-items: center; justify-content: center; gap: 5px; }
.stat-row { display: flex; flex-direction: column; align-items: center; margin-bottom: 8px; }

.playerName { display: flex; justify-content: space-between; padding: 4px 0; cursor: pointer; }
.playerName:hover { background-color: #333; }
.playerName span.hc { color: #fff; font-weight: normal; }

.uiButton { padding: 10px 20px; font-size: 20px; cursor: pointer; border-radius: 6px; border: none; background-color: #1e90ff; color: white; display: block; margin: 20px auto; }

/* Back Button - Width fixed to match form */
.back-button { 
    display: block;
    background-color: #1e90ff; 
    color: #fff; 
    text-decoration: none; 
    font-size: 24px; 
    text-align: center; 
    padding: 10px 0;
    width: 100%;
    max-width: 550px;
    margin: 10px auto; 
}

.uiText { font-size: 22px; text-align: center; margin: 10px auto; display: block; color: gold; }

.button-row {
    display: flex;
    justify-content: space-between;
    gap: 4px;
    width: 100%;
    margin-top: 20px;
    box-sizing: border-box;
}

.button-row button {
    flex: 1;
    height: 40px;
    font-size: 14px;
    padding: 0;
    text-align: center;
    white-space: nowrap;
    cursor: pointer;
}
#timerBox {
    display: none;
    position: fixed;
    width: 130px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #000;
    color: #fff;
    padding: 15px;
    border-radius: 8px;
    border: 2px solid #1e90ff;
    box-shadow: 0 4px 20px rgba(0,0,0,0.8);
    z-index: 10000;
    text-align: center;
}

#timerValue { font-size: 1.8em; font-weight: bold; display: block; margin-bottom: 5px; }
.closeBtn { background: crimson; border: none; color: white; border-radius: 4px; cursor: pointer; padding: 5px 10px; }

.player-stats-container { position: relative; display: flex; justify-content: center; gap: 40px; }
.player-stats-container::after { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: 2px; background-color: #fff; opacity: 0.5; pointer-events: none; }

#loadingOverlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.8);
    z-index: 10000;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
}

.spinner {
    width: 50px; height: 50px;
    border: 5px solid #333;
    border-top: 5px solid #1e90ff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 15px;
}
    #masterModal {
    display: none; 
    position: fixed; 
    inset: 0; 
    background: rgba(0, 0, 0, 0.9); 
    justify-content: center; 
    align-items: center; 
    z-index: 100000;
    padding: 10px;
}

.modal-container {
    background: #111; 
    padding: 20px; 
    border: 2px solid #1e90ff; 
    border-radius: 12px; 
    width: 100%; 
    max-width: 450px; 
    max-height: 85vh; /* Prevents modal from cutting off on small screens */
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    box-shadow: 0 0 20px rgba(30, 144, 255, 0.3);
}

#modalContent {
    overflow-y: auto; /* Makes Match History scrollable */
    margin-bottom: 20px;
    color: #fff;
    scrollbar-width: thin; /* Clean scrollbars for Firefox */
    scrollbar-color: #1e90ff #111;
}

#modalFooter {
    display: flex; 
    gap: 10px; 
    justify-content: center;
    flex-wrap: wrap; /* Wraps buttons if they are too wide on small phones */
}

/* Standardizing Modal Buttons */
#modalFooter button {
    padding: 10px 18px; 
    border: none; 
    border-radius: 6px; 
    font-weight: bold; 
    font-size: 16px;
    cursor: pointer;
    transition: opacity 0.2s;
}

#modalFooter button:active {
    opacity: 0.7;
}

@keyframes spin { 100% { transform: rotate(360deg); } }

/* --- MOBILE ONLY OVERRIDES --- */
@media (max-width:600px) {
    .roster-box { width: 95%; }
    .button-row button { font-size: 12px; }
}
</style>

<script>
let isLoading = false;
const FORM_KEY = "scoresheetData";
let scores = JSON.parse(localStorage.getItem("teamMatchScores")) || { home: 0, away: 0 };
let pendingPlayerData = null; 

// 1. THE BRIDGE: Run this IMMEDIATELY before anything else
(function() {
    const params = new URLSearchParams(window.location.search);
    
    if (params.has("data")) {
        const decodedData = JSON.parse(decodeURIComponent(params.get("data")));
        
        // 1. If history exists inside the data object, save it separately
        if (decodedData.hdata) {
            localStorage.setItem("matchHistory", JSON.stringify(decodedData.hdata));
            delete decodedData.hdata; // Clean it out before saving main scoresheet
        }
        
        // 2. Save the main scoresheet data
        localStorage.setItem(FORM_KEY, JSON.stringify(decodedData));

        // 3. Clean the URL
        window.history.replaceState({}, document.title, window.location.pathname);
        console.log("Full Session Synchronized");
    }
})();

window.addEventListener("DOMContentLoaded", () => {
    // 1. Session Expiry Logic
    const lastActivity = localStorage.getItem("lastSessionActivity");
    if (lastActivity && (Date.now() - parseInt(lastActivity)) > (12 * 60 * 60 * 1000)) {
        localStorage.removeItem("matchHistory");
        localStorage.removeItem("manual_roster_additions");
        localStorage.removeItem("teamMatchScores");
        localStorage.removeItem(FORM_KEY);
        scores = { home: 0, away: 0 };
    }
    localStorage.setItem("lastSessionActivity", Date.now().toString());
    
    // 2. RUN THE LOAD
    loadScoresheet();
    updateScoreUI();
    
    // 3. UPDATED: Run week/date but DON'T let it trigger the modal yet
    if (typeof scheduleData !== 'undefined') {
        const today = new Date();
        const cutoff = new Date(today);
        cutoff.setDate(cutoff.getDate() - 2);
        let activeWeek = scheduleData.find(row => row.date && new Date(row.date) >= cutoff) || scheduleData[scheduleData.length - 1];
        document.getElementById("weekDisplay").textContent = "-Week " + activeWeek.week + "-";
        document.getElementById("dateDisplay").textContent = " " + activeWeek.date;
    }

    // 4. THE MODAL BLOCKER: Final check after everything is settled
    setTimeout(() => {
        checkInitialSelection();
    }, 250); // Slightly longer delay to ensure DOM is painted
});

// --- 1. Universal Modal Engine ---
function showMasterModal(title, bodyHtml, buttons = []) {
    const modalDiv = document.getElementById("masterModal");
    if (!modalDiv) return;

    const modalHtml = `
        <div class="modal-container">
            <h3 style="color:#1e90ff; margin-top:0; text-align:center;">${title}</h3>
            <div id="modalContent" style="color:white; margin-bottom:20px;">${bodyHtml}</div>
            <div id="modalFooter" style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
                ${buttons.map(btn => `
                    <button onclick="${btn.action}" style="background:${btn.color || '#444'}; color:#fff; border:none; padding:10px 15px; border-radius:4px; cursor:pointer; font-weight:bold;">
                        ${btn.text}
                    </button>
                `).join('')}
                <button onclick="closeMasterModal()" style="background:#222; color:#fff; border:1px solid #444; padding:10px 15px; border-radius:4px; cursor:pointer;">Close</button>
            </div>
        </div>
    `;
    
    modalDiv.innerHTML = modalHtml;
    modalDiv.style.display = "flex";
}

function closeMasterModal() {
    const modalDiv = document.getElementById("masterModal");
    if (modalDiv) {
        modalDiv.style.display = "none";
        modalDiv.style.alignItems = "center";
        modalDiv.style.paddingTop = "10px";
    }
    pendingPlayerData = null;
}

window.onclick = (e) => { 
    if (e.target.id === "masterModal") closeMasterModal(); 
};

// --- 2. Roster & Player Selection ---
function updateRoster(sel, div) {
    if (!sel.value) { div.innerHTML = ""; return; }
    const rosterData = scoresheetinfo[sel.value] || [];
    div.innerHTML = rosterData.map(p => {
        const lookupHC = scoresheetrosters[p];
        const hc = (lookupHC !== undefined && lookupHC !== 0) ? lookupHC : 3;
        return `<div class="playerName" data-p="${p}" data-hc="${hc}">
                    <span class="name">${p}</span>
                    <span class="hc">${hc}</span>
                </div>`;
    }).join("");
}

["team", "opponent"].forEach(id => {
    const el = document.getElementById(id);
    if (el) {
        el.addEventListener("change", function() {
            const divId = (id === "team") ? "teamRoster" : "opponentRoster";
            updateRoster(this, document.getElementById(divId));
            saveNow();
        });
    }
});

document.addEventListener("click", e => {
    const gameArea = document.getElementById("gamePlayArea");
    if (gameArea && gameArea.style.display === "block") {
        return; 
    }

    const playerDiv = e.target.closest(".playerName");
    if (!playerDiv) return;

    const name = playerDiv.getAttribute("data-p");
    const hc = playerDiv.getAttribute("data-hc");
    const lwHeader = document.getElementById("lagWinnerHeader").textContent;

    pendingPlayerData = { name, hc };
    const resetBtn = { text: "Reset Lag", action: "resetLagFields()", color: "crimson" };

    if (lwHeader === "Lag Winner") {
        showMasterModal("Confirm Lag Winner", `<p style="text-align:center; font-size:18px;">Did <strong>${name}</strong> win the lag?</p>`, [
            { text: "YES, WINNER", action: "confirmLag(true)", color: "#1e90ff" },
            resetBtn
        ]);
    } else {
        const lagWinnerVal = document.getElementById("lagWinner").value;
        if (name === lagWinnerVal) return; 
        
        showMasterModal("Confirm Lag Loser", `<p style="text-align:center; font-size:18px;">Set <strong>${name}</strong> as Lag Loser and begin match?</p>`, [
            { text: "YES, START MATCH", action: "confirmLag(false)", color: "#1e90ff" },
            resetBtn
        ]);
    }
});

function checkInitialSelection() {
    const gameArea = document.getElementById("gamePlayArea");
    if (gameArea && gameArea.style.display === "block") {
        return; 
    }

    const teamEl = document.getElementById("team");
    if (teamEl && (teamEl.value === "Select Home Team" || teamEl.value === "")) {
        
        // --- NEW RESET LOGIC ---
        // If we are at the "Select Team" stage, it's a new session.
        // Clear the ticker flags so tonight's feats can be announced.
        localStorage.removeItem("announcedFeats");
        announcedFeats = []; 
        // -----------------------

        const options = teamEl.options;
        let teamButtonsHtml = `<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px;">`;

        for (let i = 1; i < options.length; i++) {
            const teamText = options[i].text;
            const teamNum = teamText.split(" ")[0];
            
            teamButtonsHtml += `
                <button onclick="setScoringTeam('${teamNum}')" 
                        style="background:#1e90ff; color:#fff; border:none; padding:12px 5px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:14px;">
                    ${teamText}
                </button>`;
        }
        teamButtonsHtml += `</div>`;

        showMasterModal(
            "Select Your Team", 
            `<div style='text-align:center; margin-bottom:10px;'>Opponent and Rosters will fill automatically.</div>${teamButtonsHtml}`, 
            [] 
        );
    }
}
function confirmLag(isWinner) {
    if (!pendingPlayerData) return;

    if (isWinner) {
        const name = pendingPlayerData.name;
        const hc = pendingPlayerData.hc;
        
        document.getElementById("lagWinner").value = name;
        document.getElementById("pA_hc").value = hc;
        
        const header = document.getElementById("lagWinnerHeader");
        header.textContent = name;
        header.classList.add("active");
        header.style.visibility = "visible";

        const statusEl = document.getElementById("statusText");
        if (statusEl) {
            statusEl.textContent = "Tap a Player to Set Lag Loser and Begin Match";
        }
    } else {
        const name = pendingPlayerData.name;
        const hc = pendingPlayerData.hc;
        
        document.getElementById("lagLoser").value = name;
        document.getElementById("pB_hc").value = hc;
        
        const header = document.getElementById("lagLoserHeader");
        header.textContent = name;
        header.classList.add("active");
        header.style.visibility = "visible";
        
        document.getElementById("matchInnings").value = 0;

        const toHide = ["team", "opponent", "weekDisplay", "dateDisplay", "teamRoster", "opponentRoster","addPlayerBtn","statusText"];
        toHide.forEach(id => {
            const el = document.getElementById(id);
            if (el) el.style.display = "none";
        });

        document.getElementById("gamePlayArea").style.display = "block";
    }
    
    closeMasterModal();
    updateMatchWinner(); 
    saveNow(); 
}

function getTeamNameByNumber(num) {
    const select = document.getElementById("team");
    const options = select.options;
    for (let i = 0; i < options.length; i++) {
        if (options[i].text.startsWith(num + " ")) {
            return options[i].text;
        }
    }
    return null;
}

function resetLagFields() {
    // 1. Clear standard match fields
    const mainFields = ["lagWinner", "lagLoser", "matchInnings", "matchWinner"];
    mainFields.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = (el.id === "matchInnings") ? 0 : "";
    });

    // 2. Clear ALL Player A and Player B stats and checkboxes

function findMatchup(teamNumber) {
    if (typeof scheduleData === 'undefined') return null;
    const today = new Date();
    const cutoff = new Date(today);
    cutoff.setDate(cutoff.getDate() - 2);
    const activeWeek = scheduleData.find(row => row.date && new Date(row.date) >= cutoff) || scheduleData[scheduleData.length - 1];

    for (let i = 1; i <= 5; i++) {
        const match = activeWeek["m" + i];
        if (!match) continue;
        const teamsPart = match.split('(')[0]; 
        const teams = teamsPart.split('v'); 
        const home = teams[0].trim();
        const away = teams[1].trim();
        if (home == teamNumber || away == teamNumber) return { home: home, away: away };
    }
    return null;
}

let announcedFeats = JSON.parse(localStorage.getItem("announcedFeats")) || [];

async function checkForFeats() {
    const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS_k0GqoHgGfyxHgIX-8tjbspkJ_ncZBSRCEdqf7lrfCYRFQVH3GUwxvqYGETT-ST0jswQ94V4DXsaH/pub?output=csv";
    
    // Get today's date in M/D/YYYY format to match Google Sheets default
    const today = new Date();
    const todayString = `${today.getMonth() + 1}/${today.getDate()}/${today.getFullYear()}`;

    try {
        const response = await fetch(csvUrl + "&cachebust=" + Date.now());
        const data = await response.text();
        const rows = data.split(/\r?\n/).filter(r => r.trim() !== "").slice(1); 
        
        let newFeatsFound = [];

        for (let i = 0; i < rows.length; i++) {
            const cols = rows[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            
            // 1. CHECK THE DATE (Column A = Index 0)
            const rowDate = cols[0] ? cols[0].trim() : "";
            if (!rowDate.startsWith(todayString)) {
                continue; // Skip this row if it's not from today
            }

            // 2. GET NAMES (Column D = Index 3, Column E = Index 4)
            const pAName = cols[3] ? cols[3].replace(/"/g, "").trim() : "";
            if (!pAName) break; 

            const checkFeat = (playerName, featType, val) => {
                const numericVal = parseInt(val);
                if (isNaN(numericVal) || numericVal <= 0) return;
                
                const featID = `${playerName}-${featType}`;
                if (!announcedFeats.includes(featID)) {
                    newFeatsFound.push(`${playerName} ${featType}!`);
                    announcedFeats.push(featID);
                }
            };

            // 3. CHECK FEATS
            
            // --- PLAYER A LOGIC ---
            checkFeat(pAName, "8-on-Break", cols[9]);
            checkFeat(pAName, "Break & Run", cols[10]);

            // Mini-Slam Player A (Both 8B and BR > 0)
            if (parseInt(cols[9]) > 0 && parseInt(cols[10]) > 0) {
                checkFeat(pAName, "Mini-Slam", 1);
            }

            // Rackless Player A (Only if Player B Score in Col I/Index 8 is 0)
            if (parseInt(cols[13]) === 0) {
                checkFeat(pAName, "Rackless", 1);
            }

            // --- PLAYER B LOGIC ---
            if (cols.length >= 17) {
                const pBName = cols[4] ? cols[4].replace(/"/g, "").trim() : "";
                if (pBName) {
                    checkFeat(pBName, "8-on-Break", cols[15]);
                    checkFeat(pBName, "Break & Run", cols[16]);

                    // Mini-Slam Player B (Both 8B and BR > 0)
                    if (parseInt(cols[15]) > 0 && parseInt(cols[16]) > 0) {
                        checkFeat(pBName, "Mini-Slam", 1);
                    }
                }
            }
        }

        if (newFeatsFound.length > 0) {
            showTicker("*** Congratulations " + newFeatsFound.join(" --- ") + " ***");
            localStorage.setItem("announcedFeats", JSON.stringify(announcedFeats));
        }
        
    } catch (err) {
        console.warn("Ticker update skipped:", err);
    }
}

async function showScoreBoard() {
    const board = document.getElementById('score-board');
    const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS_k0GqoHgGfyxHgIX-8tjbspkJ_ncZBSRCEdqf7lrfCYRFQVH3GUwxvqYGETT-ST0jswQ94V4DXsaH/pub?output=csv";
    
    const today = new Date();
    const todayString = `${today.getMonth() + 1}/${today.getDate()}/${today.getFullYear()}`;

    board.innerHTML = '<h3 style="color:gold;">FETCHING LIVE SCORES...</h3>';
    board.style.display = 'block';

    try {
        const response = await fetch(csvUrl + "&cachebust=" + Date.now());
        const data = await response.text();
        const rows = data.split(/\r?\n/).filter(r => r.trim() !== "").slice(1);
        
        let matchDetailsHTML = '<h4 style="color:gold; margin-top:20px;">INDIVIDUAL MATCHES</h4>';
        let teamWins = {}; 
        let foundAny = false;

        // Prep the win counter
        Object.keys(scoresheetinfo).forEach(team => teamWins[team] = 0);

        for (let i = 0; i < rows.length; i++) {
            const cols = rows[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            if (cols[0] && cols[0].trim().startsWith(todayString)) {
                
                const pAName = cols[3]?.replace(/"/g, "").trim();
                const pBName = cols[4]?.replace(/"/g, "").trim();
                const winnerName = cols[18]?.replace(/"/g, "").trim(); // Column S
                
                if (!pAName) continue;

                // Lookup winner in scoresheetinfo
                if (winnerName) {
                    for (const [teamName, players] of Object.entries(scoresheetinfo)) {
                        if (players.includes(winnerName)) {
                            teamWins[teamName]++;
                            break; 
                        }
                    }
                }

                const pAScore = cols[7] || 0;
                const pBScore = cols[8] || 0;
                matchDetailsHTML += `<div class="score-row">${pAName} ${pAScore} - ${pBScore} ${pBName}</div>`;
                foundAny = true;
            }
        }

        // Build Team Standings Table
        let teamHTML = '<h3>TONIGHT\'S STANDINGS</h3><table class="team-table">';
        teamHTML += '<tr><th style="text-align:left;">Team Name</th><th>Wins</th></tr>';
        
        let hasWins = false;
        Object.entries(teamWins)
            .sort((a, b) => b[1] - a[1]) // Top score first
            .forEach(([team, wins]) => {
                if (wins > 0) {
                    teamHTML += `<tr><td style="text-align:left;">${team}</td><td><strong>${wins}</strong></td></tr>`;
                    hasWins = true;
                }
            });
        teamHTML += '</table>';

        if (!foundAny) {
            board.innerHTML = '<h3>No matches recorded today.</h3><div class="score-close" onclick="this.parentElement.style.display=\'none\'">[ CLOSE ]</div>';
        } else {
            board.innerHTML = teamHTML + matchDetailsHTML + '<div class="score-close" onclick="this.parentElement.style.display=\'none\'">[ CLOSE ]</div>';
        }

    } catch (err) {
        board.innerHTML = '<h3 style="color:red;">Error loading scores.</h3><div class="score-close" onclick="this.parentElement.style.display=\'none\'">[ CLOSE ]</div>';
    }
}
</script>
