<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current Category Leaders</title>
    <script src="playerdata.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        h1 { color: #1e90ff; margin-bottom: 30px; border-bottom: 2px solid #1e90ff; display: inline-block; padding-bottom: 10px; }
        
        .leader-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .leader-card {
            background: #1a1a1a;
            border: 2px solid gold;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.2);
        }

        .category-name {
            font-size: 1.2em;
            color: gold;
            text-transform: uppercase;
            margin-bottom: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        .leader-name {
            font-size: 1.5em;
            font-weight: bold;
            color: #fff;
        }

        .score {
            font-size: 1.8em;
            color: #1e90ff;
            margin-top: 5px;
        }

        .footer-note {
            margin-top: 50px;
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>
<body>

    <h1>Current League Leaders</h1>
    <div id="leaderGrid" class="leader-grid">
        </div>

    <p class="footer-note">Reading data from <strong>playerdata.js</strong></p>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (typeof playerData === 'undefined') {
                document.getElementById('leaderGrid').innerHTML = "<h2 style='color:red;'>Error: playerdata.js not found or playerData array is missing!</h2>";
                return;
            }

            // 1. Configuration
            const lowIsBetter = ["Life Hash", "White Washed"];
            const ignoreKeys = ["Player #", "Player Name", "Handicap", "HC", "Matches Played"];

            // 2. Get all valid categories from the first player record
            const categories = Object.keys(playerData[0]).filter(key => !ignoreKeys.includes(key));
            const grid = document.getElementById('leaderGrid');

            categories.forEach(cat => {
                // 3. Sort players to find the #1 for this specific category
                const sorted = [...playerData].sort((a, b) => {
                    let valA = parseFloat(String(a[cat]).replace('%', '')) || 0;
                    let valB = parseFloat(String(b[cat]).replace('%', '')) || 0;

                    if (lowIsBetter.includes(cat)) {
                        // For 'low is best', ignore 0s as they haven't set a score yet
                        if (valA === 0) valA = 999999;
                        if (valB === 0) valB = 999999;
                        return valA - valB;
                    }
                    return valB - valA;
                });

                const leader = sorted[0];
                const leaderName = leader["Player Name"];
                const leaderVal = leader[cat];

                // 4. Create the UI Card
                const card = document.createElement('div');
                card.className = 'leader-card';
                card.innerHTML = `
                    <div class="category-name">${cat}</div>
                    <div class="leader-name">${leaderName}</div>
                    <div class="score">${leaderVal}</div>
                `;
                grid.appendChild(card);
            });
        });
    </script>
</body>
</html>
