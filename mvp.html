<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Top 20 MVP</title>
    <style>
        body { 
            background-color: #000; 
            color: #fff; 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column; /* Stack H2 and Table vertically */
            align-items: center; 
            padding: 1px;
            margin: 0;
        }
        #mvp-container {
            width: 100%; /* Container takes full width */
        }
        table { 
            border-collapse: collapse; 
            width: 100%; /* Table fills the container */
            background-color: #1a1a1a;
        }
        th, td { 
            border: 1px solid #444; 
            padding: 12px; 
            text-align: left; 
        }
        th { 
            background-color: #333; 
            color: #1e90ff; 
        }
        h2 { 
            text-align: center; 
            color: #fff;
            margin-bottom: 20px;
        }
        tr:nth-child(even) {
            background-color: #222;
        }
        /* Make columns consistent */
        th:nth-child(1), td:nth-child(1) { width: 10%; text-align: center; } /* Rank */
        th:nth-child(3), td:nth-child(3) { width: 15%; text-align: center; } /* Points */
          .form-wrapper {
    width: 100%; /* Spans full width */
    padding: 2px;
    border: 4px solid #1e90ff;
    border-radius: 0; /* Optional: remove radius for true edge-to-edge look */
    box-sizing: border-box; /* Crucial: includes padding/border in 100% width */
}
       .floating-buttons {
    position: fixed;
    bottom: 15px;
    left: 50%;                 /* move the left edge to the center */
    transform: translateX(-50%); /* pull it back by half its width */
    text-decoration: none;
    display: flex;
    justify-content: center;

    width: 40%;
    height: 30px;
    background-color: #1e90ff;
    color: #fff;
    font-size: 22px;
    border-radius: 6px;
    text-align: center;
}
    </style>
</head>
     <div class="form-wrapper">
<body>

    <div id="mvp-container">
        <h2>MVP Winter 2026</h2>
        <table id="mvp-table">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Player Name</th>
                    <th>Points</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
<a class="floating-buttons" style="margin-top:50px;" href="allstatssplash.html">Back</a>
    <script src="leaders.js"></script>
    <script>
        function populateTable(tableId, data) {
            const tbody = document.querySelector(`#${tableId} tbody`);
            tbody.innerHTML = ""; 
            
            data.slice(0, 20).forEach((player, index) => {
                const row = `<tr>
                    <td>${index + 1}</td>
                    <td>${player["Player Name"]}</td>
                    <td>${player.Points}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        window.onload = () => {
            if (typeof mvpList !== 'undefined') {
                populateTable('mvp-table', mvpList);
            }
        };
    </script>
</body>
     </div>
</html>
