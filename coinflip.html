<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Toss - Who Breaks?</title>
    <style>
        body {
            background-color: #000;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            color: #4af;
            margin: 50px;
        }

        .coin-wrapper {
            width: 150px;
            height: 150px;
            perspective: 1000px;
            margin-bottom: 50px;
        }

        #coin {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 3s cubic-bezier(0.1, 1, 0.1, 1);
        }

        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
            backface-visibility: hidden;
            border: 4px solid #4af;
            box-sizing: border-box;
        }

        /* HEADS: White with Black Text */
        .heads {
            background: #ffffff;
            color: #000000;
            z-index: 2;
        }

        /* TAILS: Black with White Text */
        .tails {
            background: #000000;
            color: #ffffff;
            transform: rotateY(180deg);
            border-color: #666;
        }

        #result-text {
            font-size: 24px;
            height: 30px;
            margin-bottom: 30px;
            font-weight: bold;
            text-transform: uppercase;
        }

        button {
            background: #4af;
            color: white;
            border: none;
margin-bottom: 20px;
width: 150px;
height:50px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.1s, background 0.3s;
        }

        button:active {
            transform: scale(0.95);
        }

        button:disabled {
            background: #444;
            cursor: not-allowed;
        }
.form-wrapper {
    width: 100%;
    padding: 2px;
    border: 4px solid #1e90ff;
    box-sizing: border-box;
    /* ADD THESE THREE LINES */
    display: flex;
    flex-direction: column;
    align-items: center;
}
        .menu-button {
    display: block;
            margin-top: 20px;
    margin-left: auto;
    margin-right: auto;   /* centers horizontally with zero vertical spacing */
    text-align: center;
    padding: 4px;
    background: #4af;
    color: white;
    text-decoration: none;
    font-size: 24px;
    border-radius: 8px;
    font-weight: bold;
    height: 28px;
    width: 250px;
}
    </style>
</head>
<body>
<div class="form-wrapper">
    <h1>Away Team Calls</h1>

    <div class="coin-wrapper">
        <div id="coin">
            <div class="face heads">Heads</div>
            <div class="face tails">Tails</div>
        </div>
    </div>

    <div id="result-text"></div>

    <button id="flip-btn" onclick="flipCoin()">FLIP COIN</button>
    <button href="scoresheet.html">Score Sheet</button>
    <button href="index.html">Menu</button>
</div>

    <script>
        let currentRotation = 0;

        function flipCoin() {
            const coin = document.getElementById('coin');
            const btn = document.getElementById('flip-btn');
            const resultText = document.getElementById('result-text');

            btn.disabled = true;
            resultText.textContent = "";

            const isHeads = Math.random() < 0.5;
            const extraDegrees = isHeads ? 0 : 180;
            const spinDegrees = 3600 + extraDegrees;
            
            currentRotation += spinDegrees;
            coin.style.transform = `rotateY(${currentRotation}deg)`;

            setTimeout(() => {
                if (isHeads) {
                    resultText.textContent = "";
                    resultText.style.color = "#ffffff";
                } else {
                    resultText.textContent = "";
                    resultText.style.color = "#888";
                }
                btn.disabled = false;
            }, 3100);
        }
    </script>

</body>
</html>
