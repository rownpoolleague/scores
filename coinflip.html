<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coin Toss - Who Breaks?</title>
    <style>
        /* Reset and force full view */
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background-color: #000;
            color: white;
            font-family: sans-serif;
            overflow-x: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Border stays at screen edges */
        .form-wrapper {
            width: 100%;
            min-height: 100vh;
            border: 4px solid #4af;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 10px;
        }

        h1 {
            color: #4af;
            margin: 0 0 20px 0;
            text-align: center;
            font-size: 28px;
        }

        .coin-wrapper {
            width: 150px;
            height: 150px;
            perspective: 1000px;
            margin-bottom: 20px;
        }

        #coin {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 3s cubic-bezier(0.1, 1, 0.1, 1);
            cursor: pointer;
        }

        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
            backface-visibility: hidden;
            border: 4px solid #4af;
        }

        .heads { 
            background: #ffffff; 
            color: #000000; 
            z-index: 2; 
        }

        .tails { 
            background: #000000; 
            color: #ffffff; 
            transform: rotateY(180deg); 
            border-color: #666; 
        }

        #result-text {
            font-size: 24px;
            height: 30px;
            margin: 20px 0 40px 0;
            font-weight: bold;
            text-transform: uppercase;
            text-align: center;
            min-height: 30px;
        }

        /* Buttons standardized for mobile thumbs */
        button {
            background: #4af;
            color: white;
            border: none;
            margin-bottom: 12px;
            width: 220px;
            height: 55px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, background 0.3s;
            flex-shrink: 0;
        }

        button:active { 
            transform: scale(0.95); 
        }

        button:disabled { 
            background: #444; 
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="form-wrapper">
    <h1>Away Team Calls</h1>

    <div class="coin-wrapper" onclick="flipCoin()">
        <div id="coin">
            <div class="face heads">Heads</div>
            <div class="face tails">Tails</div>
        </div>
    </div>

    <div id="result-text"></div>

    <button id="flip-btn" onclick="flipCoin()">FLIP COIN</button>
    <button onclick="window.location.href='scoresheet.html'">Score Sheet</button>
    <button onclick="window.location.href='index.html'">Menu</button>
</div>

<script>
    let currentRotation = 0;

    function flipCoin() {
        const coin = document.getElementById('coin');
        const btn = document.getElementById('flip-btn');
        const resultText = document.getElementById('result-text');

        if (btn.disabled) return;

        btn.disabled = true;
        resultText.textContent = "Flipping...";
        resultText.style.color = "#4af";

        const isHeads = Math.random() < 0.5;
        const extraDegrees = isHeads ? 0 : 180;
        // Spin at least 10 times
        const spinDegrees = 3600 + extraDegrees;
        
        currentRotation += spinDegrees;
        coin.style.transform = `rotateY(${currentRotation}deg)`;

        setTimeout(() => {
            if (isHeads) {
                resultText.textContent = "Heads Wins";
                resultText.style.color = "#ffffff";
            } else {
                resultText.textContent = "Tails Wins";
                resultText.style.color = "#888"; // Subtle grey for tails
            }
            btn.disabled = false;
        }, 3100);
    }
</script>

</body>
</html>
