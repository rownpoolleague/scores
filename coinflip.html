<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coin Toss - Who Breaks?</title>
    <style>
        /* 1. Remove all default spacing and force full height */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow-x: hidden; /* Prevent horizontal scrolling */
        }

        body {
            color: white;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 2. Edge-to-edge wrapper with internal centering */
        .form-wrapper {
            width: 100%;
            min-height: 100vh; /* Full screen height */
            padding: 10px;
            border: 4px solid #4af;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1 {
            color: #4af;
            margin-bottom: 30px;
            text-align: center;
        }

        .coin-wrapper {
            width: 150px;
            height: 150px;
            perspective: 1000px;
            margin-bottom: 30px;
        }

        #coin {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 3s cubic-bezier(0.1, 1, 0.1, 1);
            cursor: pointer;
        }

        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
            backface-visibility: hidden;
            border: 4px solid #4af;
            box-sizing: border-box;
        }

        .heads { background: #ffffff; color: #000000; z-index: 2; }
        .tails { background: #000000; color: #ffffff; transform: rotateY(180deg); border-color: #666; }

        #result-text {
            font-size: 24px;
            height: 30px;
            margin-top: 70px;
            margin-bottom: 100px;
            font-weight: bold;
            text-transform: uppercase;
            text-align: center;
        }

        /* Standardized Buttons */
        button {
            background: #4af;
            color: white;
            border: none;
            margin-bottom: 15px;
            width: 200px; /* Wider for better thumb tap */
            height: 55px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px; /* Matching your menu-button style */
            cursor: pointer;
            transition: transform 0.1s;
        }

        button:active { transform: scale(0.95); }
        button:disabled { background: #444; }

    </style>
</head>
<body>

<div class="form-wrapper">
    <h1>Away Team Calls</h1>

    <div class="coin-wrapper" onclick="flipCoin()">
        <div id="coin">
            <div class="face heads">Heads</div>
            <div class="face tails">Tails</div>
        </div>
    </div>

    <div id="result-text"></div>

    <button id="flip-btn" onclick="flipCoin()">FLIP COIN</button>
    <button onclick="window.location.href='scoresheet.html'">Score Sheet</button>
    <button onclick="window.location.href='index.html'">Menu</button>
</div>

<script>
    let currentRotation = 0;

    function flipCoin() {
        const coin = document.getElementById('coin');
        const btn = document.getElementById('flip-btn');
        const resultText = document.getElementById('result-text');

        if (btn.disabled) return;

        btn.disabled = true;
        resultText.textContent = "Flipping...";
        resultText.style.color = "#4af";

        const isHeads = Math.random() < 0.5;
        const extraDegrees = isHeads ? 0 : 180;
        const spinDegrees = 3600 + extraDegrees;
        
        currentRotation += spinDegrees;
        coin.style.transform = `rotateY(${currentRotation}deg)`;

        setTimeout(() => {
            if (isHeads) {
                resultText.textContent = "Heads Wins";
                resultText.style.color = "#ffd700";
            } else {
                resultText.textContent = "Tails Wins";
                resultText.style.color = "#ffd700";
            }
            btn.disabled = false;
        }, 3100);
    }
</script>

</body>
</html>
