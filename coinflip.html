<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Flip</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .coin-container {
            perspective: 1000px;
            cursor: pointer;
        }

        #coin {
            width: 150px;
            height: 150px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .coin-side {
            position: absolute;
            width: 75%;
            height: 75%;
            border-radius: 50%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 24px;
            background-color: #000;
            box-sizing: border-box;
            
        }

        /* HEADS - Logo Side */
        .heads {
            background: #000;
        }

        .heads img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }

        /* TAILS Side */
        .tails {
            background: #000;
            color: #000;
            transform: rotateY(180deg);
        }

        #result-text {
            margin-top: 30px;
            font-size: 28px;
            font-weight: bold;
            color: #00ff00;
            height: 35px;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        .instruction {
            margin-bottom: 20px;
            color: #888;
            font-size: 16px;
        }

        .back-btn {
            margin-top: 50px;
            color: #4af;
            text-decoration: none;
            border: 1px solid #4af;
            padding: 10px 20px;
            border-radius: 5px;
        }
        /* 1. Add this to your Global Styles to stop the "Flash" on tap */
* {
    -webkit-tap-highlight-color: transparent;
    outline: none;
}

.coin-container {
    perspective: 1000px;
    cursor: pointer;
    user-select: none; /* Prevents text selection during tap */
}

#coin {
    width: 150px;
    height: 150px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.coin-side {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    backface-visibility: hidden; /* Keeps the 'other' side hidden */
    -webkit-backface-visibility: hidden; /* Safari support */
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    border: 2px solid #1e90ff;
}

/* 2. Separate the faces slightly in 3D space to stop "Z-fighting" flash */
.heads {
    background: #222;
    transform: rotateY(0deg) translateZ(1px);
}

.tails {
    background: #1e90ff;
    color: #000;
    transform: rotateY(180deg) translateZ(1px);
}
    </style>
</head>
<body>

    <div class="instruction">Tap the coin to flip</div>

    <div class="coin-container" onclick="flipCoin()">
        <div id="coin">
            <div class="coin-side heads">
                <img src="white transparent.png" alt="LOGO" onerror="this.style.display='none'; this.parentElement.innerHTML='HEADS';">
            </div>
            <div class="coin-side tails">TAILS</div>
        </div>
    </div>

    <div id="result-text">Ready?</div>

    <a href="javascript:history.back()" class="back-btn">Back to Scoresheet</a>

    <script>
       // 3. Updated Script to handle the spin cleanly
let currentRotation = 0;
let isFlipping = false;

function flipCoin() {
    if (isFlipping) return; // Prevent double-taps during animation
    
    isFlipping = true;
    const coin = document.getElementById('coin');
    const resultText = document.getElementById('result-text');
    
    const isHeads = Math.random() < 0.5;
    const spinDegrees = isHeads ? 1800 : 1980; 
    currentRotation += spinDegrees;

    coin.style.transform = `rotateY(${currentRotation}deg) scale(1.1)`;
    resultText.innerText = "Flipping...";

    setTimeout(() => {
        coin.style.transform = `rotateY(${currentRotation}deg) scale(1.0)`;
        resultText.innerText = isHeads ? "HEADS" : "TAILS";
        isFlipping = false;
    }, 2000);
}
    </script>
</body>
</html>
