<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROPL League Leaders</title>
    <style>
        body { 
            background-color: #000; 
            color: #fff; 
            font-family: sans-serif; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }
        h1 { color: #1e90ff; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 30px; }
        .leader-table { width: 100%; max-width: 800px; border-collapse: collapse; margin-bottom: 50px; }
        .leader-table th { 
            text-align: left; 
            color: #888; 
            font-size: 0.8rem; 
            text-transform: uppercase; 
            padding: 10px; 
            border-bottom: 1px solid #333;
        }
        .leader-table td { padding: 12px 10px; border-bottom: 1px solid #222; }
        .category-header { 
            background-color: #111; 
            color: #1e90ff; 
            font-weight: bold; 
            text-align: center !important;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }
        .rank-col { width: 50px; color: #fff; font-family: monospace; }
        .player-col { font-weight: bold; }
        .score-col { text-align: right; color: #fff; font-family: monospace; font-size: 1.1rem; width: 100px; }
        .mp-note { font-size: 0.7rem; color: #fff; font-weight: normal; vertical-align: middle; margin-left: 5px; }
    </style>
</head>
<body>

    <h1>🏆 League Leaders</h1>

    <div id="leaderboard-container" style="width: 100%; max-width: 800px;">
        </div>

    <script src="playerdata.js"></script>
    <script>
        const statsToDisplay = [
            "8 on Break",
            "Break and Run",
            "Mini-Slam",
            "Rackless",
            "Undefeated",
            "Longest Win Streak",
            "Life Hash",
            "Match Win %",
            "Game Win %"
        ];

        const lowerIsBetter = ["Life Hash", "White Washed"];
        const minMPRequiredStats = ["Match Win %", "Game Win %", "Life Hash", "% Weeks w/8OB, BR or Rackless", "White Washed"];

        function getRankedData(statKey) {
            return playerData
                .filter(p => {
                    if (minMPRequiredStats.includes(statKey)) {
                        return p["Matches Played"] >= 25;
                    }
                    return true;
                })
                .map(p => {
                    let raw = p[statKey];
                    let value = parseFloat(typeof raw === "string" ? raw.replace('%', '') : raw);
                    return { name: p["Player Name"], value: value };
                })
                .filter(p => Number.isFinite(p.value))
                .sort((a, b) => {
                    return lowerIsBetter.includes(statKey) ? a.value - b.value : b.value - a.value;
                })
                .slice(0, 10);
        }

        function renderLeaderboard() {
            const container = document.getElementById('leaderboard-container');
            if (typeof playerData === 'undefined') return;

            container.innerHTML = '';

            statsToDisplay.forEach(statKey => {
                const ranked = getRankedData(statKey);
                if (ranked.length === 0) return;

                const isMinMP = minMPRequiredStats.includes(statKey);
                
                const table = document.createElement('table');
                table.className = 'leader-table';
                
                let tableHTML = `
                    <thead>
                        <tr>
                            <th colspan="3" class="category-header">
                                ${statKey.toUpperCase()} ${isMinMP ? '<span class="mp-note">(MIN 25 MP)</span>' : ''}
                            </th>
                        </tr>
                        <tr>
                            <th>Rank</th>
                            <th>Player</th>
                            <th style="text-align: right;">Score</th>
                        </tr>
                    </thead>
                    <tbody>
                `;

                ranked.forEach((p, i) => {
                    tableHTML += `
                        <tr>
                            <td class="rank-col">${i + 1}</td>
                            <td class="player-col">${p.name}</td>
                            <td class="score-col">${p.value}${statKey.includes('%') ? '%' : ''}</td>
                        </tr>
                    `;
                });

                tableHTML += `</tbody>`;
                table.innerHTML = tableHTML;
                container.appendChild(table);
            });
        }

        window.onload = renderLeaderboard;
    </script>
</body>
</html>
