<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROPL League Leaders</title>
    <style>
        body { 
            background-color: #000; 
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }
        h1 { color: #1e90ff; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 30px; }
        .leader-table { width: 100%; max-width: 600px; border-collapse: collapse; }
        .leader-table th { 
            text-align: left; 
            color: #888; 
            font-size: 0.8rem; 
            text-transform: uppercase; 
            padding: 10px; 
            border-bottom: 1px solid #333;
        }
        .leader-table td { padding: 15px 10px; border-bottom: 1px solid #222; }
        .category { font-weight: bold; color: #fff; }
        .player-name { color: #1e90ff; font-weight: bold; }
        .score { text-align: right; color: #ff4500; font-family: monospace; font-size: 1.2rem; }
        .trophy { margin-right: 10px; }
    </style>
</head>
<body>

    <h1>🏆 League Leaders</h1>

    <table class="leader-table">
        <thead>
            <tr>
                <th>Category</th>
                <th>Leader</th>
                <th style="text-align: right;">Record</th>
            </tr>
        </thead>
        <tbody id="leader-body">
            </tbody>
    </table>

    <script src="playerdata.js"></script>
    <script>
        // Assuming targetScores and playerData are available from playerdata.js
        const categories = [
            { key: "8 on Break", label: "8 on Break" },
            { key: "Break and Run", label: "Break & Run" },
            { key: "Mini-Slam", label: "Mini-Slam" },
            { key: "Rackless", label: "Rackless Matches" },
            { key: "Undefeated", label: "Undefeated" },
            { key: "Longest Win Streak", label: "Longest Win Streak" }
        ];

        function loadLeaders() {
            const tbody = document.getElementById('leader-body');
            tbody.innerHTML = '';

            categories.forEach(cat => {
                // Find the player(s) with the highest score in this category
                const topScore = targetScores[cat.key] || 0;
                
                // Find name associated with top score
                const leaders = playerData
                    .filter(p => (parseFloat(String(p[cat.key]).replace('%', '')) || 0) === topScore && topScore > 0)
                    .map(p => p["Player Name"])
                    .join(", ");

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="category">${cat.label}</td>
                    <td class="player-name">${leaders || "No Record"}</td>
                    <td class="score">${topScore}</td>
                `;
                tbody.appendChild(row);
            });
        }

        // Initialize
        window.onload = loadLeaders;
    </script>
</body>
</html>
