<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROPL League Leaders</title>
    <style>
        body { 
            background-color: #000; 
            color: #fff; 
            font-family: sans-serif; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }
        h1 { color: #1e90ff; text-transform: uppercase; letter-spacing: 4px; margin-bottom: 40px; border-bottom: 2px solid #1e90ff; padding-bottom: 10px; }
        
        .leader-card { 
            width: 100%; 
            max-width: 500px; 
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            margin-bottom: 30px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .card-header {
            background: #222;
            padding: 10px 15px;
            border-bottom: 1px solid #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .category-name {
            color: #1e90ff;
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .mp-tag {
            font-size: 0.6rem;
            background: #ff4500;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        /* Top Spot Styling */
        .top-spot {
            padding: 20px 15px;
            background: linear-gradient(180deg, #1a1a1a 0%, #111 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-name {
            font-family: monospace;
            font-size: 1.5rem;
            color: #ffd700; /* Gold */
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .top-score {
            font-family: monospace;
            font-size: 1.8rem;
            font-weight: bold;
            color: #fff;
        }

        /* Runners Up Styling */
        .runner-up {
            padding: 8px 15px;
            border-top: 1px solid #222;
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #aaa;
            font-family: monospace;
        }

        .runner-name { color: #ddd; }
        .runner-score { color: #fff; }
        .rank { color: #555; margin-right: 10px; }
    </style>
</head>
<body>

    <h1>🏆 LEADERS</h1>

    <div id="leaderboard-container" style="width: 100%; max-width: 800px; display: flex; flex-direction: column; align-items: center;">
        </div>

    <script src="playerdata.js"></script>
    <script>
        const statsToDisplay = [
            "8 on Break",
            "Break and Run",
            "Mini-Slam",
            "Rackless",
            "Undefeated",
            "Longest Win Streak",
            "Life Hash",
            "Match Win %",
            "Game Win %"
        ];

        const lowerIsBetter = ["Life Hash", "White Washed"];
        const minMPRequiredStats = ["Match Win %", "Game Win %", "Life Hash", "% Weeks w/8OB, BR or Rackless", "White Washed"];

        function getRankedData(statKey) {
            return playerData
                .filter(p => {
                    if (minMPRequiredStats.includes(statKey)) {
                        return p["Matches Played"] >= 25;
                    }
                    return true;
                })
                .map(p => {
                    let raw = p[statKey];
                    let value = parseFloat(typeof raw === "string" ? raw.replace('%', '') : raw);
                    return { name: p["Player Name"], value: value };
                })
                .filter(p => Number.isFinite(p.value))
                .sort((a, b) => {
                    return lowerIsBetter.includes(statKey) ? a.value - b.value : b.value - a.value;
                })
                .slice(0, 3); // ONLY TOP 3
        }

        function renderLeaderboard() {
            const container = document.getElementById('leaderboard-container');
            if (typeof playerData === 'undefined') return;

            container.innerHTML = '';

            statsToDisplay.forEach(statKey => {
                const ranked = getRankedData(statKey);
                if (ranked.length === 0) return;

                const isMinMP = minMPRequiredStats.includes(statKey);
                const suffix = statKey.includes('%') ? '%' : '';
                
                const card = document.createElement('div');
                card.className = 'leader-card';
                
                // Header
                let cardHTML = `
                    <div class="card-header">
                        <span class="category-name">${statKey}</span>
                        ${isMinMP ? '<span class="mp-tag">MIN 25 MP</span>' : ''}
                    </div>
                `;

                // #1 Spot
                const top = ranked[0];
                cardHTML += `
                    <div class="top-spot">
                        <div class="top-name">${top.name.toUpperCase()}</div>
                        <div class="top-score">${top.value}${suffix}</div>
                    </div>
                `;

                // #2 and #3 Spots
                if (ranked.length > 1) {
                    for (let i = 1; i < ranked.length; i++) {
                        cardHTML += `
                            <div class="runner-up">
                                <span><span class="rank">#${i + 1}</span><span class="runner-name">${ranked[i].name}</span></span>
                                <span class="runner-score">${ranked[i].value}${suffix}</span>
                            </div>
                        `;
                    }
                }

                card.innerHTML = cardHTML;
                container.appendChild(card);
            });
        }

        window.onload = renderLeaderboard;
    </script>
</body>
</html>
