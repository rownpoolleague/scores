<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scheduled Scoresheet</title>
    <script src="schedule.js"></script>
    <script src="scoresheetinfo.js"></script>
    <script src="masterme.js"></script>
    <style>
        :root { --bg: #1a1a1a; --card: #2a2a2a; --text: #ffffff; --accent: #00ff00; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 15px; margin: 0; }
        
        .header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .week-num { color: var(--accent); font-size: 1.4rem; font-weight: bold; }

        .setup-row { display: flex; align-items: center; justify-content: space-between; background: var(--card); padding: 20px; border-radius: 10px; }
        .box { width: 45%; text-align: center; }
        select { width: 100%; padding: 12px; background: #333; color: #fff; border: 1px solid #444; border-radius: 5px; font-size: 16px; }
        .opp-display { font-size: 1.1rem; font-weight: bold; color: var(--accent); padding: 10px; background: #111; border-radius: 5px; border: 1px solid #444; min-height: 20px; text-align: center; }

        .roster-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .roster-box { background: var(--card); padding: 10px; border-radius: 10px; min-height: 100px; border-top: 3px solid transparent; }
        .home-accent { border-top-color: var(--accent); }
        .away-accent { border-top-color: #ff4444; }
        
        .playerName { width: 100%; padding: 12px; margin: 8px 0; background: #444; border: none; color: #fff; border-radius: 5px; cursor: pointer; text-align: left; font-size: 14px; }
        .hc-badge { float: right; color: var(--accent); font-weight: bold; }

        /* Lag Modal */
        #lagModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--card); padding: 20px; border-radius: 10px; width: 85%; max-width: 400px; text-align: center; border: 1px solid var(--accent); }
        .modal-btn { width: 100%; padding: 12px; background: var(--accent); color: #000; border: none; border-radius: 5px; font-weight: bold; margin-top: 15px; cursor: pointer; }
    </style>
</head>
<body>

<div class="header">
    <div id="dateDisplay" style="color:#888; font-size: 0.8rem;">---</div>
    <div id="weekDisplay" class="week-num">Detecting Week...</div>
</div>

<div class="setup-row">
    <div class="box">
        <label style="display:block; font-size:10px; color:#aaa; margin-bottom:5px; text-transform:uppercase;">Your Team</label>
        <select id="team" onchange="findMatchup()">
            <option value="">-- Select --</option>
        </select>
    </div>
    <div style="font-weight:bold; color:var(--accent); margin-top: 15px;">VS</div>
    <div class="box">
        <label style="display:block; font-size:10px; color:#aaa; margin-bottom:5px; text-transform:uppercase;">Opponent</label>
        <div id="oppName" class="opp-display">---</div>
    </div>
</div>

<div class="roster-grid">
    <div id="homeContainer" class="roster-box">
        <strong id="homeTitle" style="font-size:11px; color:var(--accent);">HOME ROSTER</strong>
        <div id="homeRoster"></div>
    </div>
    <div id="awayContainer" class="roster-box">
        <strong id="awayTitle" style="font-size:11px; color:#ff4444;">AWAY ROSTER</strong>
        <div id="awayRoster"></div>
    </div>
</div>

<div id="lagModal">
    <div class="modal-content">
        <h2 style="margin-top:0;">Match Start</h2>
        <p id="matchInfo" style="font-size: 1.1rem;"></p>
        <button class="modal-btn" onclick="closeModal()">LET'S PLAY</button>
    </div>
</div>

<script>
const teamMap = {
    "1": "Halfway Crooks", "2": "Haters Welcome", "3": "Lynn's Amigos", "4": "Rackless Behavior",
    "5": "Dirty Ballers", "6": "8 on Break", "7": "Five Amigos", "8": "Frank's Pizza",
    "9": "Killer Instinct", "10": "Pete's Bunch"
};

let activeWeek = null;

function getHC(fullName) {
    if (typeof masterme === 'undefined') return "?";
    const searchParts = fullName.toLowerCase().split(' ');
    const player = masterme.find(p => {
        const masterName = p["Player Name"].toLowerCase();
        return searchParts.every(part => masterName.includes(part));
    });
    return player ? player["HC"] : "?";
}

function init() {
    const teamSelect = document.getElementById("team");
    Object.keys(teamMap).forEach(num => {
        const opt = document.createElement("option");
        opt.value = num;
        opt.textContent = teamMap[num];
        teamSelect.appendChild(opt);
    });

    if (typeof scheduleData !== 'undefined') {
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        activeWeek = scheduleData.find(w => {
            const p = w.date.split('/');
            const matchDate = new Date(p[2], p[0]-1, p[1]);
            return matchDate >= today;
        }) || scheduleData[scheduleData.length - 1];

        document.getElementById("weekDisplay").textContent = "Week " + activeWeek.week;
        document.getElementById("dateDisplay").textContent = activeWeek.date;
    }
}

function findMatchup() {
    const myNum = document.getElementById("team").value;
    const oppLabel = document.getElementById("oppName");
    
    if (!myNum) {
        oppLabel.textContent = "---";
        document.getElementById("homeRoster").innerHTML = "";
        document.getElementById("awayRoster").innerHTML = "";
        return;
    }

    let homeNum = null;
    let awayNum = null;
    let amIHome = true;

    for (let i = 1; i <= 5; i++) {
        let matchStr = activeWeek["m" + i];
        if (!matchStr) continue;
        let pair = matchStr.split('(')[0]; 
        let teams = pair.split('v'); // teams[0] is home, teams[1] is away

        if (teams[0] === myNum) {
            homeNum = teams[0];
            awayNum = teams[1];
            amIHome = true;
            break;
        } else if (teams[1] === myNum) {
            homeNum = teams[0];
            awayNum = teams[1];
            amIHome = false;
            break;
        }
    }

    if (homeNum && awayNum) {
        oppLabel.textContent = amIHome ? teamMap[awayNum] : teamMap[homeNum];
        
        // Update Labels to show which is yours
        document.getElementById("homeTitle").textContent = "HOME: " + teamMap[homeNum] + (amIHome ? " (YOU)" : "");
        document.getElementById("awayTitle").textContent = "AWAY: " + teamMap[awayNum] + (!amIHome ? " (YOU)" : "");

        renderRoster(teamMap[homeNum], "homeRoster");
        renderRoster(teamMap[awayNum], "awayRoster");
    }
}

function renderRoster(teamName, containerId) {
    const container = document.getElementById(containerId);
    container.innerHTML = "";
    if (typeof scoresheetinfo === 'undefined') return;

    const players = scoresheetinfo[teamName] || [];
    players.forEach(name => {
        const hc = getHC(name);
        const btn = document.createElement("button");
        btn.className = "playerName";
        btn.innerHTML = `<span>${name}</span><span class="hc-badge">${hc}</span>`;
        btn.onclick = () => openModal(name, hc);
        container.appendChild(btn);
    });
}

function openModal(playerName, hc) {
    document.getElementById("matchInfo").textContent = `Starting match for: ${playerName} (${hc})`;
    document.getElementById("lagModal").style.display = "flex";
}

function closeModal() {
    document.getElementById("lagModal").style.display = "none";
}

window.onload = init;
</script>
</body>
</html>
