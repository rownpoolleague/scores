<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Toss - Who Breaks?</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #000;
            color: white;
        }

        .form-wrapper {
            width: 100%;
            padding: 2px;
            border: 4px solid #4af;
            box-sizing: border-box;
        }

        .overlay {
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            font-size: 32px;
        }

        .coin-wrapper {
            width: 220px;
            height: 220px;
            perspective: 1000px;
            margin: 20px 0;
        }

        #coin {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 3s cubic-bezier(0.1, 1, 0.1, 1);
            cursor: pointer;
        }

        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
            backface-visibility: hidden;
            border: 4px solid #4af;
        }

        .heads { background: #ffffff; color: #000000; z-index: 2; }
        .tails { background: #000000; color: #ffffff; transform: rotateY(180deg); border-color: #666; }

        #result-text {
            font-size: 24px;
            height: 30px;
            margin: 20px 0;
            font-weight: bold;
            text-transform: uppercase;
            text-align: center;
            color: #ffd700;
        }

        .menu-button {
            display: block;
            margin: 10px auto;
            text-align: center;
            padding: 4px;
            background: #4af;
            color: white;
            text-decoration: none;
            font-size: 24px;
            border-radius: 8px;
            font-weight: bold;
            height: 38px; /* Adjusted height to match your Menu look */
            width: 200px;
            border: none;
            cursor: pointer;
        }

        .menu-button:disabled {
            background: #444;
        }
    </style>
</head>
<body>

<div class="form-wrapper">
    <div class="overlay">
        <h1>Away Team Calls</h1>

        <div class="coin-wrapper" onclick="flipCoin()">
            <div id="coin">
                <div class="face heads">Heads</div>
                <div class="face tails">Tails</div>
            </div>
        </div>

        <div id="result-text"></div>

        <button id="flip-btn" class="menu-button" onclick="flipCoin()">FLIP COIN</button>
        <button class="menu-button" onclick="window.location.href='scoresheet.html'">Score Sheet</button>
        <button class="menu-button" onclick="window.location.href='index.html'">Menu</button>
    </div>
</div>

<script>
    let currentRotation = 0;

    function flipCoin() {
        const coin = document.getElementById('coin');
        const btn = document.getElementById('flip-btn');
        const resultText = document.getElementById('result-text');

        if (btn.disabled) return;

        btn.disabled = true;
        resultText.textContent = "Flipping...";
        resultText.style.color = "#1e90ff";

        const isHeads = Math.random() < 0.5;
        const extraDegrees = isHeads ? 0 : 180;
        currentRotation += (3600 + extraDegrees);
        
        coin.style.transform = `rotateY(${currentRotation}deg)`;

        setTimeout(() => {
            if (isHeads) {
                resultText.textContent = "Heads Wins";
                resultText.style.color = "#ffffff";
            } else {
                resultText.textContent = "Tails Wins";
                resultText.style.color = "#ffd700";
            }
            btn.disabled = false;
        }, 3100);
    }
</script>

</body>
</html>
