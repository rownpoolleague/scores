<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="theme.css">
    <title>Most Improved Winter 26</title>
    <style>
        body { 
            background-color: #000; 
            color: #fff; 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column; /* Stack H2 and Table vertically */
            align-items: center; 
            padding: 1px;
            margin: 0;
        }
        #mimp-container {
            width: 100%; /* Container takes full width */
        }
        table { 
            border-collapse: collapse; 
            width: 100%; /* Table fills the container */
            background-color: #1a1a1a;
        }
        th, td { 
            border: 1px solid #444; 
            padding: 12px; 
            text-align: left; 
        }
        th { 
            background-color: #333; 
                   }
        h2 { 
            text-align: center; 
            color: #fff;
            margin-bottom: 20px;
        }
        tr:nth-child(even) {
            background-color: #222;
        }
        /* Make columns consistent */
        th:nth-child(1), td:nth-child(1) { width: 10%; text-align: center; } /* Rank */
        th:nth-child(3), td:nth-child(3) { width: 15%; text-align: center; } /* Points */
         .form-wrapper {
    width: 100%;
    min-height: 100vh;   /* Always at least full phone height */
    padding: 2px;
    border-radius: 0;
    box-sizing: border-box;
}
        .floating-buttons {
    position: fixed;
    bottom: 15px;
    left: 50%;                 /* move the left edge to the center */
    transform: translateX(-50%); /* pull it back by half its width */
    text-decoration: none;
    display: flex;
    justify-content: center;
    width: 40%;
    height: 30px;
    color: #fff;
    font-size: 22px;
    border-radius: 6px;
    text-align: center;
}
    </style>
</head>
     <div class="form-wrapper">
<body>

    <div id="mimp-container">
       <h2>Most Improved Winter 2026<br>Min 8 MP</h2>
        <table id="mimp-table">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Player Name</th>
                    <th>% Better</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script src="mimplist.js"></script>
    <script>
        function populateTable(tableId, data) {
            const tbody = document.querySelector(`#${tableId} tbody`);
            tbody.innerHTML = ""; 
            
            data.slice(0, 20).forEach((player, index) => {
                const row = `<tr>
                    <td>${index + 1}</td>
                    <td>${player["Player Name"]}</td>
                    <td>${player.Points}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        window.onload = () => {
            if (typeof mimpList !== 'undefined') {
                populateTable('mimp-table', mimpList);
            }
        };
    </script>
<a class="floating-buttons" style="margin-top:50px;" href="allstatssplash.html">Back</a>
</body>
     </div>
</html>
